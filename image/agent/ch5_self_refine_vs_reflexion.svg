<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect x="0" y="0" width="800" height="460" rx="12" fill="#faf8f5"/>
  <rect x="0" y="0" width="800" height="460" rx="12" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <defs>
    <marker id="ar4b" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="ar4g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e7d32"/>
    </marker>
    <marker id="ar4o" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e65100"/>
    </marker>
    <marker id="ar4r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
    </marker>
  </defs>
  <g transform="translate(30,30)">

  <!-- Self-Refine -->
  <rect x="10" y="10" width="340" height="360" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="180" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Self-Refine</text>
  <text x="180" y="56" text-anchor="middle" font-size="11" fill="#1565c0">无记忆的迭代改进</text>

  <!-- 生成初稿 -->
  <rect x="50" y="72" width="260" height="36" rx="6" fill="#bbdefb" stroke="#1565c0"/>
  <text x="180" y="95" text-anchor="middle" font-size="12">生成初稿 (Draft)</text>
  <line x1="180" y1="108" x2="180" y2="130" stroke="#1565c0" stroke-width="2" marker-end="url(#ar4b)"/>

  <!-- 自我批评 -->
  <rect x="50" y="130" width="260" height="36" rx="6" fill="#ef9a9a" stroke="#c62828"/>
  <text x="180" y="153" text-anchor="middle" font-size="12">自我批评 (Critique)</text>
  <line x1="180" y1="166" x2="180" y2="188" stroke="#c62828" stroke-width="2" marker-end="url(#ar4r)"/>

  <!-- 判断 -->
  <polygon points="180,188 250,218 180,248 110,218" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="180" y="222" text-anchor="middle" font-size="10" font-weight="bold">APPROVED?</text>

  <!-- 改进循环 -->
  <line x1="110" y1="218" x2="50" y2="218" stroke="#c62828" stroke-width="2"/>
  <line x1="50" y1="218" x2="50" y2="280" stroke="#c62828" stroke-width="2"/>
  <line x1="50" y1="280" x2="180" y2="280" stroke="#c62828" stroke-width="2" marker-end="url(#ar4r)"/>

  <rect x="50" y="268" width="260" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="180" y="291" text-anchor="middle" font-size="12">改进 (Refine)</text>

  <!-- 改进后回到批评 -->
  <line x1="310" y1="286" x2="340" y2="286" stroke="#2e7d32" stroke-width="2"/>
  <line x1="340" y1="286" x2="340" y2="148" stroke="#2e7d32" stroke-width="2"/>
  <line x1="340" y1="148" x2="315" y2="148" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar4g)"/>

  <text x="85" y="260" font-size="10" fill="#c62828">否</text>
  <text x="250" y="242" font-size="10" fill="#2e7d32">是 → 输出</text>

  <!-- 无记忆标记 -->
  <rect x="80" y="320" width="200" height="36" rx="6" fill="#ffcdd2" stroke="#c62828" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="180" y="343" text-anchor="middle" font-size="11" fill="#c62828">无记忆：每次改进独立</text>

  <!-- Reflexion -->
  <rect x="370" y="10" width="340" height="360" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="540" y="38" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">Reflexion</text>
  <text x="540" y="56" text-anchor="middle" font-size="11" fill="#e65100">带记忆的反思式学习</text>

  <!-- 执行任务 -->
  <rect x="410" y="72" width="260" height="36" rx="6" fill="#ffe0b2" stroke="#e65100"/>
  <text x="540" y="95" text-anchor="middle" font-size="12">执行任务 (Attempt)</text>
  <line x1="540" y1="108" x2="540" y2="130" stroke="#e65100" stroke-width="2" marker-end="url(#ar4o)"/>

  <!-- 评估 -->
  <rect x="410" y="130" width="260" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="540" y="153" text-anchor="middle" font-size="12">评估 (Score: 1-10)</text>
  <line x1="540" y1="166" x2="540" y2="188" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar4g)"/>

  <!-- 判断 -->
  <polygon points="540,188 610,218 540,248 470,218" fill="#fff9c4" stroke="#f9a825" stroke-width="2"/>
  <text x="540" y="222" text-anchor="middle" font-size="10" font-weight="bold">Score ≥ 8?</text>

  <!-- 是 → 输出 -->
  <line x1="610" y1="218" x2="670" y2="218" stroke="#2e7d32" stroke-width="2" marker-end="url(#ar4g)"/>
  <text x="640" y="210" font-size="10" fill="#2e7d32">是</text>
  <rect x="670" y="200" width="40" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="690" y="222" text-anchor="middle" font-size="11" fill="#2e7d32">✓</text>

  <!-- 否 → 反思 -->
  <line x1="470" y1="218" x2="410" y2="218" stroke="#c62828" stroke-width="2"/>
  <line x1="410" y1="218" x2="410" y2="275" stroke="#c62828" stroke-width="2" marker-end="url(#ar4r)"/>
  <text x="440" y="240" font-size="10" fill="#c62828">否</text>

  <rect x="410" y="275" width="260" height="36" rx="6" fill="#e1bee7" stroke="#7b1fa2"/>
  <text x="540" y="298" text-anchor="middle" font-size="12">反思 (Reflection)</text>

  <!-- 记忆 -->
  <rect x="410" y="324" width="260" height="36" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="540" y="347" text-anchor="middle" font-size="11" font-weight="bold" fill="#5e35b1">存入 Memory 💾</text>

  <!-- 记忆回到执行 -->
  <line x1="670" y1="342" x2="690" y2="342" stroke="#5e35b1" stroke-width="2"/>
  <line x1="690" y1="342" x2="690" y2="90" stroke="#5e35b1" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="690" y1="90" x2="675" y2="90" stroke="#5e35b1" stroke-width="2" marker-end="url(#ar4o)"/>
  <text x="700" y="220" font-size="9" fill="#5e35b1" transform="rotate(90,700,220)">下次带着经验重试</text>
  </g>
</svg>
