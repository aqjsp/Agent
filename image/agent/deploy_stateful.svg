<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="920" height="540" rx="16" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">有状态 Agent 怎么扩：外置 Checkpoint，不要 sticky</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">会话打到另一台必须能找到上一份 State；亲和只能当优化，不能当正确性</text>

  <defs>
    <marker id="darr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="40" y="88" width="160" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">用户请求</text>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#1e40af">thread_id=T9</text>

  <path d="M200 124 H250" stroke="#64748b" stroke-width="2" marker-end="url(#darr)"/>

  <rect x="250" y="88" width="160" height="72" rx="12" fill="#e2e8f0" stroke="#64748b"/>
  <text x="330" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">负载均衡</text>
  <text x="330" y="140" text-anchor="middle" font-size="11" fill="#475569">不要靠会话粘滞保正确</text>

  <rect x="460" y="80" width="140" height="88" rx="12" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="530" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">副本 A</text>
  <text x="530" y="132" text-anchor="middle" font-size="11" fill="#334155">正在跑 T9</text>
  <text x="530" y="150" text-anchor="middle" font-size="11" fill="#64748b">持有 thread 锁</text>

  <rect x="640" y="80" width="140" height="88" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="710" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">副本 B</text>
  <text x="710" y="132" text-anchor="middle" font-size="11" fill="#334155">resume HITL?</text>
  <text x="710" y="150" text-anchor="middle" font-size="11" fill="#b45309">无锁就会分叉</text>

  <rect x="800" y="80" width="80" height="88" rx="12" fill="#fff" stroke="#94a3b8"/>
  <text x="840" y="122" text-anchor="middle" font-size="12" fill="#475569">副本 C</text>
  <text x="840" y="144" text-anchor="middle" font-size="11" fill="#64748b">空闲</text>

  <rect x="40" y="220" width="840" height="140" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="460" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">所有副本读同一份外置状态</text>
  <rect x="70" y="272" width="240" height="64" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="190" y="298" text-anchor="middle" font-size="13" fill="#065f46">Postgres / Redis</text>
  <text x="190" y="318" text-anchor="middle" font-size="11" fill="#047857">Checkpointer · 生产底线</text>
  <rect x="340" y="272" width="240" height="64" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="460" y="298" text-anchor="middle" font-size="13" fill="#065f46">按 thread_id 锁 / 单分区队列</text>
  <text x="460" y="318" text-anchor="middle" font-size="11" fill="#047857">同一会话命令串行</text>
  <rect x="610" y="272" width="240" height="64" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="730" y="298" text-anchor="middle" font-size="13" fill="#065f46">图版本钉在 metadata</text>
  <text x="730" y="318" text-anchor="middle" font-size="11" fill="#047857">灰度按 thread 哈希，不按用户随机</text>

  <rect x="40" y="384" width="400" height="120" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="240" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">假正确</text>
  <text x="240" y="444" text-anchor="middle" font-size="12" fill="#7f1d1d">内存 checkpointer · sticky session</text>
  <text x="240" y="466" text-anchor="middle" font-size="12" fill="#7f1d1d">HITL 占着工作线程等人</text>
  <text x="240" y="486" text-anchor="middle" font-size="12" fill="#7f1d1d">健康检查只 ping 进程活着</text>

  <rect x="480" y="384" width="400" height="120" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="680" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">真正确</text>
  <text x="680" y="444" text-anchor="middle" font-size="12" fill="#14532d">interrupt 后 HTTP 202，人点了再 POST</text>
  <text x="680" y="466" text-anchor="middle" font-size="12" fill="#14532d">线程池按正在推理的图扩</text>
  <text x="680" y="486" text-anchor="middle" font-size="12" fill="#14532d">checkpointer 可写 + 模型可达 + 熔断没全开</text>
</svg>
