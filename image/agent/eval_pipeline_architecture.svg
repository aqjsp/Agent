<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" width="920" height="560">
  <rect width="920" height="560" rx="16" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Agent 评估流水线</text>
  <text x="460" y="66" text-anchor="middle" font-size="13" fill="#64748b">从代码提交到生产监控，评估贯穿全流程</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Timeline -->
  <line x1="100" y1="120" x2="830" y2="120" stroke="#cbd5e1" stroke-width="3"/>

  <!-- Stage 1: Commit -->
  <circle cx="160" cy="120" r="18" fill="#2563eb"/>
  <text x="160" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
  <text x="160" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">Commit</text>
  
  <rect x="105" y="150" width="110" height="80" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="160" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">组件测试</text>
  <text x="160" y="192" text-anchor="middle" font-size="10" fill="#334155">+ Smoke 10%</text>
  <text x="160" y="210" text-anchor="middle" font-size="10" fill="#64748b">秒级 / 无成本</text>

  <!-- Stage 2: PR -->
  <circle cx="340" cy="120" r="18" fill="#22c55e"/>
  <text x="340" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <text x="340" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">PR</text>
  
  <rect x="285" y="150" width="110" height="80" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="340" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">回归测试</text>
  <text x="340" y="192" text-anchor="middle" font-size="10" fill="#334155">全量 × 1 run</text>
  <text x="340" y="210" text-anchor="middle" font-size="10" fill="#64748b">分钟级 / 低成本</text>

  <!-- Stage 3: Release -->
  <circle cx="520" cy="120" r="18" fill="#f59e0b"/>
  <text x="520" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
  <text x="520" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">发版</text>
  
  <rect x="465" y="150" width="110" height="80" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="520" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">完整评估</text>
  <text x="520" y="192" text-anchor="middle" font-size="10" fill="#334155">全量 × 3 runs</text>
  <text x="520" y="210" text-anchor="middle" font-size="10" fill="#64748b">小时级 / 高精度</text>

  <!-- Stage 4: Production -->
  <circle cx="700" cy="120" r="18" fill="#ef4444"/>
  <text x="700" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>
  <text x="700" y="98" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">生产</text>
  
  <rect x="645" y="150" width="110" height="80" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="700" y="172" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">日常监控</text>
  <text x="700" y="192" text-anchor="middle" font-size="10" fill="#334155">采样 + Judge</text>
  <text x="700" y="210" text-anchor="middle" font-size="10" fill="#64748b">持续 / 告警驱动</text>

  <!-- Arrows -->
  <path d="M215 165 L285 165" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M395 165 L465 165" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M575 165 L645 165" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom section: Data flow -->
  <rect x="60" y="270" width="800" height="250" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="90" y="300" font-size="15" font-weight="700" fill="#0f172a">评估基础设施</text>

  <!-- Eval Dataset -->
  <rect x="90" y="320" width="160" height="70" rx="10" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="170" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">Eval Dataset</text>
  <text x="170" y="368" text-anchor="middle" font-size="10" fill="#334155">500+ cases</text>
  <text x="170" y="382" text-anchor="middle" font-size="10" fill="#64748b">正常/边界/对抗</text>

  <!-- Judge -->
  <rect x="300" y="320" width="160" height="70" rx="10" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="380" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#be185d">LLM-as-Judge</text>
  <text x="380" y="368" text-anchor="middle" font-size="10" fill="#334155">规则 + LLM 混合</text>
  <text x="380" y="382" text-anchor="middle" font-size="10" fill="#64748b">多维度评分</text>

  <!-- Trace Store -->
  <rect x="510" y="320" width="160" height="70" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text x="590" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">Trace Store</text>
  <text x="590" y="368" text-anchor="middle" font-size="10" fill="#334155">分层存储</text>
  <text x="590" y="382" text-anchor="middle" font-size="10" fill="#64748b">摘要/基本/完整/调试</text>

  <!-- Dashboard -->
  <rect x="720" y="320" width="120" height="70" rx="10" fill="#ecfdf5" stroke="#6ee7b7"/>
  <text x="780" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">Dashboard</text>
  <text x="780" y="368" text-anchor="middle" font-size="10" fill="#334155">趋势 + 告警</text>
  <text x="780" y="382" text-anchor="middle" font-size="10" fill="#64748b">pass_rate 曲线</text>

  <!-- Connections -->
  <path d="M250 355 L300 355" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M460 355 L510 355" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M670 355 L720 355" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Feedback loop -->
  <path d="M780 390 L780 460 L170 460 L170 390" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="460" y="478" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">反馈闭环：生产失败 → 自动生成新 Eval Case → 加入数据集</text>

  <text x="460" y="540" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">评估不是一次性的，而是持续运行的质量守卫系统</text>
</svg>
