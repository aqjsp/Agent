<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="system-ui, -apple-system, sans-serif">
  <rect width="800" height="540" fill="#fafafa" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Function Calling 协议流程</text>

  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#1976D2"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#388E3C"/>
    </marker>
    <marker id="ao" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#E65100"/>
    </marker>
    <marker id="ap" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#6A1B9A"/>
    </marker>
  </defs>

  <!-- ===== 泳道背景 ===== -->
  <rect x="20" y="48" width="355" height="480" rx="8" fill="#e3f2fd" stroke="#1976D2" stroke-width="1.5"/>
  <text x="197" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565C0">Model（LLM）</text>

  <rect x="425" y="48" width="355" height="480" rx="8" fill="#e8f5e9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="602" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#2E7D32">Harness（代码）</text>

  <!-- ===== Step 1: 接收输入 ===== -->
  <rect x="45" y="88" width="305" height="38" rx="5" fill="#fff" stroke="#1976D2" stroke-width="1.5"/>
  <text x="197" y="112" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565C0">1. 接收 messages + tools schema</text>

  <line x1="197" y1="126" x2="197" y2="148" stroke="#1976D2" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- ===== Step 2: LLM 推理 ===== -->
  <rect x="55" y="148" width="285" height="38" rx="5" fill="#bbdefb" stroke="#1976D2" stroke-width="1.5"/>
  <text x="197" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#0D47A1">2. LLM 推理（next-token prediction）</text>

  <line x1="197" y1="186" x2="197" y2="208" stroke="#1976D2" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- ===== Step 3: 决策菱形 ===== -->
  <polygon points="197,208 260,237 197,266 134,237" fill="#FFF9C4" stroke="#F57F17" stroke-width="1.5"/>
  <text x="197" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">输出</text>
  <text x="197" y="247" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">tool_calls?</text>

  <!-- ===== "是" 分支：右转到 Harness ===== -->
  <line x1="260" y1="237" x2="425" y2="237" stroke="#E65100" stroke-width="2" marker-end="url(#ao)"/>
  <text x="335" y="230" font-size="11" fill="#E65100" font-weight="bold">是</text>
  <rect x="300" y="242" width="68" height="14" rx="3" fill="#fff3e0"/>
  <text x="334" y="253" text-anchor="middle" font-size="8" fill="#E65100">JSON 文本</text>

  <!-- ===== "否" 分支：左转下走到最终回答 ===== -->
  <path d="M 134,237 L 78,237 L 78,441 L 100,441" stroke="#388E3C" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="92" y="230" font-size="11" fill="#388E3C" font-weight="bold">否</text>
  <text x="92" y="340" font-size="9" fill="#388E3C">直接</text>
  <text x="92" y="354" font-size="9" fill="#388E3C">回答</text>

  <!-- ===== Step 4: 解析 ===== -->
  <rect x="445" y="213" width="310" height="42" rx="5" fill="#fff3e0" stroke="#E65100" stroke-width="1.5"/>
  <text x="600" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#E65100">4. 解析 tool_calls</text>
  <text x="600" y="248" text-anchor="middle" font-size="9" fill="#666">提取 name、arguments、tool_call_id</text>

  <line x1="600" y1="255" x2="600" y2="278" stroke="#388E3C" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ===== Step 5: 执行 ===== -->
  <rect x="445" y="278" width="310" height="48" rx="5" fill="#c8e6c9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="600" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">5. 执行工具函数</text>
  <text x="600" y="314" text-anchor="middle" font-size="9" fill="#333">func = TOOL_MAP[name]</text>
  <text x="600" y="326" text-anchor="middle" font-size="9" fill="#333">result = func(**arguments)</text>

  <line x1="600" y1="326" x2="600" y2="350" stroke="#388E3C" stroke-width="1.5" marker-end="url(#ag)"/>

  <!-- ===== Step 6: 组装返回 ===== -->
  <rect x="445" y="350" width="310" height="42" rx="5" fill="#e0f2f1" stroke="#00796B" stroke-width="1.5"/>
  <text x="600" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#00897B">6. 组装 role:tool 消息</text>
  <text x="600" y="385" text-anchor="middle" font-size="9" fill="#666">tool_call_id 必须与原请求配对</text>

  <!-- ===== Step 7: 结果加入 messages ===== -->
  <rect x="210" y="350" width="160" height="42" rx="5" fill="#f3e5f5" stroke="#6A1B9A" stroke-width="1.5"/>
  <text x="290" y="371" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A1B9A">7. 加入 messages</text>
  <text x="290" y="385" text-anchor="middle" font-size="9" fill="#666">下一轮推理可见</text>

  <!-- 跨泳道箭头：Step 6 → Step 7 -->
  <line x1="445" y1="371" x2="370" y2="371" stroke="#6A1B9A" stroke-width="2" marker-end="url(#ap)"/>
  <rect x="393" y="358" width="42" height="14" rx="3" fill="#f3e5f5"/>
  <text x="414" y="368" text-anchor="middle" font-size="8" fill="#6A1B9A" font-weight="bold">结果</text>

  <!-- ===== 循环箭头：Step 7 → Step 2 ===== -->
  <path d="M 210,371 L 35,371 L 35,167 L 55,167" stroke="#78909c" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#ab)"/>
  <text x="24" y="260" font-size="9" fill="#78909c" font-weight="bold">loop</text>
  <text x="24" y="275" font-size="8" fill="#78909c">回到</text>
  <text x="24" y="288" font-size="8" fill="#78909c">Step 2</text>

  <!-- ===== 最终回答 ===== -->
  <rect x="100" y="422" width="195" height="38" rx="5" fill="#e8f5e9" stroke="#388E3C" stroke-width="2"/>
  <text x="197" y="446" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">输出最终回答</text>

  <rect x="120" y="468" width="155" height="28" rx="14" fill="#388E3C"/>
  <text x="197" y="487" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">循环终止</text>

  <!-- ===== 要点说明 ===== -->
  <rect x="445" y="415" width="310" height="75" rx="5" fill="#fff9c4" stroke="#f57f17" stroke-width="1" opacity="0.9"/>
  <text x="600" y="435" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">要点</text>
  <text x="455" y="452" font-size="9" fill="#333">• Model 只输出文本（JSON），不执行代码</text>
  <text x="455" y="467" font-size="9" fill="#333">• tool_call_id 配对请求和响应</text>
  <text x="455" y="482" font-size="9" fill="#333">• 多个 tool_calls 由 Harness 并行执行</text>
</svg>