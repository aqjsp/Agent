<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600">
  <rect width="980" height="600" rx="12" fill="#fafafa"/>
  <g transform="translate(70,60)">
    <text x="410" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Token 分词流程：从文本到模型输入</text>
    <text x="410" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">文本 → 字节 → BPE 合并 → Token ID → Embedding 查表 → 高维向量</text>

    <!-- Step 1: Raw text -->
    <rect x="30" y="70" width="760" height="55" rx="8" fill="#e3f2fd" stroke="#2196F3" stroke-width="1.5"/>
    <text x="410" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1565c0">1. 原始文本</text>
    <text x="410" y="112" text-anchor="middle" font-family="monospace" font-size="14" fill="#333">"unbreakable 人工智能"</text>

    <!-- Arrow -->
    <line x1="410" y1="130" x2="410" y2="148" stroke="#999" stroke-width="1.5"/>
    <polygon points="410,148 405,141 415,141" fill="#999"/>

    <!-- Step 2: UTF-8 bytes -->
    <rect x="30" y="155" width="760" height="55" rx="8" fill="#fff3e0" stroke="#FF9800" stroke-width="1.5"/>
    <text x="410" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#e65100">2. UTF-8 字节编码</text>
    <text x="180" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">u n b r e a k a b l e</text>
    <text x="530" y="198" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">E4 BA BA E5 B7 A5 E6 99 BA E8 83 BD</text>

    <!-- Arrow -->
    <line x1="410" y1="215" x2="410" y2="233" stroke="#999" stroke-width="1.5"/>
    <polygon points="410,233 405,226 415,226" fill="#999"/>

    <!-- Step 3: BPE merges -->
    <rect x="30" y="240" width="760" height="65" rx="8" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="410" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#2e7d32">3. BPE 合并（按训练好的合并规则）</text>
    <rect x="55" y="270" width="250" height="25" rx="4" fill="#c8e6c9"/>
    <text x="180" y="287" text-anchor="middle" font-family="monospace" font-size="10" fill="#1b5e20">"un" + "break" + "able" (3 tokens)</text>
    <rect x="380" y="270" width="380" height="25" rx="4" fill="#c8e6c9"/>
    <text x="570" y="287" text-anchor="middle" font-family="monospace" font-size="10" fill="#1b5e20">"人" + "工" + "智能" (3 tokens)</text>

    <!-- Arrow -->
    <line x1="410" y1="310" x2="410" y2="328" stroke="#999" stroke-width="1.5"/>
    <polygon points="410,328 405,321 415,321" fill="#999"/>

    <!-- Step 4: Token IDs -->
    <rect x="30" y="335" width="760" height="55" rx="8" fill="#e8eaf6" stroke="#1a237e" stroke-width="1.5"/>
    <text x="410" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#1a237e">4. Token ID 查表</text>
    <text x="180" y="378" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">[4861, 5418, 743]</text>
    <text x="530" y="378" text-anchor="middle" font-family="monospace" font-size="11" fill="#333">[782, 1203, 45201]</text>

    <!-- Arrow -->
    <line x1="410" y1="395" x2="410" y2="413" stroke="#999" stroke-width="1.5"/>
    <polygon points="410,413 405,406 415,406" fill="#999"/>

    <!-- Step 5: Embedding -->
    <rect x="30" y="420" width="760" height="55" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="1.5"/>
    <text x="410" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#c62828">5. Embedding 查表 → 高维向量</text>
    <text x="410" y="462" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">每个 Token ID → embedding_table[id] → shape [8192] 的浮点向量</text>
  </g>
</svg>