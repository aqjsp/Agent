<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 640" font-family="monospace, system-ui, sans-serif" width="820" height="640">
  <rect width="760" height="580" fill="#fafafa" rx="8"/>
  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Function Calling 数据流：messages 列表如何一步步增长</text>

  <!-- 轮次0：初始消息 -->
  <rect x="30" y="42" width="700" height="78" rx="6" fill="#fff" stroke="#78909c" stroke-width="1"/>
  <text x="50" y="60" font-size="11" fill="#1976D2" font-weight="bold">初始消息</text>
  <text x="50" y="80" font-size="12" fill="#333">role: system    → "你是一个有帮助的AI助手。需要时使用工具获取信息。"</text>
  <text x="50" y="100" font-size="12" fill="#333">role: user      → "北京今天天气怎么样？"</text>
  <text x="630" y="80" font-size="9" fill="#78909c">开发者</text>
  <text x="630" y="100" font-size="9" fill="#78909c">开发者</text>

  <!-- 轮次1：Model 输出 -->
  <rect x="30" y="136" width="700" height="58" rx="6" fill="#fff" stroke="#E65100" stroke-width="1.5"/>
  <text x="50" y="156" font-size="11" fill="#E65100" font-weight="bold">第 1 轮：Model 输出</text>
  <text x="50" y="178" font-size="12" fill="#333">role: assistant → tool_calls: [{name: "get_weather", args: {city: "北京"}}]</text>
  <text x="630" y="178" font-size="9" fill="#E65100">Model 添加</text>

  <!-- 箭头1 -->
  <line x1="380" y1="194" x2="380" y2="210" stroke="#78909c" stroke-width="1.5"/>
  <polygon points="380,210 375,202 385,202" fill="#78909c"/>

  <!-- Harness 执行 -->
  <rect x="30" y="214" width="700" height="58" rx="6" fill="#fff" stroke="#388E3C" stroke-width="1.5"/>
  <text x="50" y="234" font-size="11" fill="#388E3C" font-weight="bold">第 1 轮：Harness 执行工具并拼回结果</text>
  <text x="50" y="256" font-size="12" fill="#333">role: tool     → {"temp": "22", "condition": "晴", "humidity": "45"}</text>
  <text x="630" y="256" font-size="9" fill="#388E3C">Harness 添加</text>

  <!-- 箭头2 -->
  <line x1="380" y1="272" x2="380" y2="288" stroke="#78909c" stroke-width="1.5"/>
  <polygon points="380,288 375,280 385,280" fill="#78909c"/>

  <!-- 轮次2：Model 生成回答 -->
  <rect x="30" y="292" width="700" height="58" rx="6" fill="#fff" stroke="#E65100" stroke-width="1.5"/>
  <text x="50" y="312" font-size="11" fill="#E65100" font-weight="bold">第 2 轮：Model 基于工具结果生成回答</text>
  <text x="50" y="334" font-size="12" fill="#333">role: assistant → "北京今天天气晴朗，气温22°C，湿度45%。"</text>
  <text x="630" y="334" font-size="9" fill="#E65100">Model 添加</text>

  <!-- 箭头3 -->
  <line x1="380" y1="350" x2="380" y2="368" stroke="#78909c" stroke-width="1.5"/>
  <polygon points="380,368 375,360 385,360" fill="#78909c"/>

  <!-- 循环结束 -->
  <rect x="180" y="372" width="400" height="32" rx="16" fill="#e8f5e9" stroke="#388E3C" stroke-width="1.5"/>
  <text x="380" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#2E7D32">Model 不再输出 tool_calls → 循环结束</text>

  <!-- 关键观察 -->
  <rect x="30" y="424" width="700" height="144" rx="6" fill="#f5f5f5" stroke="#bdbdbd" stroke-width="1"/>
  <text x="50" y="446" font-size="12" fill="#1a1a1a" font-weight="bold">关键观察</text>
  <text x="50" y="468" font-size="11" fill="#333">1. 消息列表只增不减——Model 能看到所有历史</text>
  <text x="50" y="490" font-size="11" fill="#333">2. tool_calls 的 role 是 assistant——它是 LLM 的普通输出，内容是结构化 JSON</text>
  <text x="50" y="512" font-size="11" fill="#333">3. tool 结果的 role 是 tool——Harness 添加的，tool_call_id 关联到 Model 的请求</text>
  <text x="50" y="534" font-size="11" fill="#333">4. Agent 不知道 X？查 messages 里有没有 X</text>
  <text x="50" y="556" font-size="11" fill="#c62828" font-weight="bold">   没有 → Harness 设计问题（没注入），不是 Model 问题</text>
</svg>