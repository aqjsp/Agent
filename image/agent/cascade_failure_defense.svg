<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="920" height="560" rx="16" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Agent 级联故障防线</text>
  <text x="460" y="68" text-anchor="middle" font-size="13" fill="#64748b">局部故障必须被切断，不能沿调用链、状态链、资源链扩散</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Failure source -->
  <rect x="60" y="120" width="150" height="80" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="135" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">局部故障</text>
  <text x="135" y="174" text-anchor="middle" font-size="12" fill="#7f1d1d">Tool 超时</text>
  <text x="135" y="192" text-anchor="middle" font-size="12" fill="#7f1d1d">Worker 崩溃</text>

  <!-- Cascading path without defense -->
  <path d="M210 160 C270 105, 330 105, 390 160 S510 215, 570 160 S690 105, 750 160" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#redArrow)"/>
  <text x="480" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#ef4444">没有防线：失败继续扩散</text>
  
  <rect x="760" y="120" width="110" height="80" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="815" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">系统雪崩</text>
  <text x="815" y="174" text-anchor="middle" font-size="12" fill="#7f1d1d">队列积压</text>
  <text x="815" y="192" text-anchor="middle" font-size="12" fill="#7f1d1d">资源耗尽</text>

  <!-- Defense layers -->
  <rect x="250" y="245" width="420" height="245" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="460" y="277" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">五道防线</text>

  <rect x="285" y="300" width="135" height="52" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="352" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">Timeout</text>
  <text x="352" y="342" text-anchor="middle" font-size="11" fill="#334155">停止无限等待</text>

  <rect x="500" y="300" width="135" height="52" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="567" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">Retry Budget</text>
  <text x="567" y="342" text-anchor="middle" font-size="11" fill="#334155">避免重试风暴</text>

  <rect x="285" y="370" width="135" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="352" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">Circuit Breaker</text>
  <text x="352" y="412" text-anchor="middle" font-size="11" fill="#334155">连续失败后熔断</text>

  <rect x="500" y="370" width="135" height="52" rx="10" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="567" y="392" text-anchor="middle" font-size="13" font-weight="700" fill="#7e22ce">Fallback</text>
  <text x="567" y="412" text-anchor="middle" font-size="11" fill="#334155">跳过/替换/人工</text>

  <rect x="392" y="440" width="135" height="52" rx="10" fill="#e0f2fe" stroke="#06b6d4"/>
  <text x="459" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#0e7490">Bulkhead</text>
  <text x="459" y="482" text-anchor="middle" font-size="11" fill="#334155">隔离故障半径</text>

  <!-- shield arrows -->
  <path d="M135 210 L300 300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M620 300 L815 210" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Healthy degraded output -->
  <rect x="695" y="300" width="175" height="100" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="782" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">降级运行</text>
  <text x="782" y="357" text-anchor="middle" font-size="12" fill="#14532d">部分结果可用</text>
  <text x="782" y="377" text-anchor="middle" font-size="12" fill="#14532d">风险显式披露</text>

  <rect x="50" y="300" width="175" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="137" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">故障输入</text>
  <text x="137" y="357" text-anchor="middle" font-size="12" fill="#7c2d12">超时 / 异常 / 污染</text>
  <text x="137" y="377" text-anchor="middle" font-size="12" fill="#7c2d12">先隔离再恢复</text>

  <text x="460" y="530" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">可靠性目标：不是不出错，而是出错后仍能受控地继续运行</text>
</svg>
