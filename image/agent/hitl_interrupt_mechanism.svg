<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#475569"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#ef4444"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="7" markerHeight="5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="680" height="420" fill="#f8fafc" rx="10"/>

  <!-- 标题 -->
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">interrupt 机制底层：Checkpoint + GraphInterrupt</text>

  <!-- === 阶段1：正常执行 === -->
  <text x="40" y="56" font-size="11" font-weight="700" fill="#334155">① 正常执行阶段</text>

  <rect x="40" y="68" width="120" height="32" rx="6" fill="#3b82f6"/>
  <text x="100" y="89" text-anchor="middle" font-size="10" fill="#fff">LLM 推理</text>
  <line x1="160" y1="84" x2="190" y2="84" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="190" y="68" width="120" height="32" rx="6" fill="#8b5cf6"/>
  <text x="250" y="89" text-anchor="middle" font-size="10" fill="#fff">执行工具</text>
  <line x1="310" y1="84" x2="340" y2="84" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="340" y="68" width="120" height="32" rx="6" fill="#f97316"/>
  <text x="400" y="89" text-anchor="middle" font-size="10" fill="#fff">权限检查</text>

  <!-- Checkpoint 链 -->
  <text x="40" y="118" font-size="9" fill="#64748b">执行产生 Checkpoint 链：</text>
  <rect x="40" y="126" width="50" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="65" y="140" text-anchor="middle" font-size="8" fill="#475569">cp-1</text>
  <line x1="90" y1="136" x2="108" y2="136" stroke="#94a3b8" stroke-width="1"/>
  <rect x="108" y="126" width="50" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="133" y="140" text-anchor="middle" font-size="8" fill="#475569">cp-2</text>
  <line x1="158" y1="136" x2="176" y2="136" stroke="#94a3b8" stroke-width="1"/>
  <rect x="176" y="126" width="50" height="20" rx="3" fill="#fde68a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="201" y="140" text-anchor="middle" font-size="8" fill="#78350f" font-weight="600">cp-3</text>
  <text x="240" y="140" font-size="8" fill="#f59e0b" font-weight="600">← 中断点</text>

  <!-- === 阶段2：中断 === -->
  <text x="40" y="172" font-size="11" font-weight="700" fill="#334155">② 检测到 interrupt_before → 中断</text>

  <rect x="40" y="184" width="260" height="56" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="52" y="202" font-size="10" fill="#991b1b" font-weight="600">1. 保存 Checkpoint（State + 断点 + 执行路径）</text>
  <text x="52" y="218" font-size="10" fill="#991b1b" font-weight="600">2. 抛出 GraphInterrupt（特殊异常，框架捕获）</text>
  <text x="52" y="234" font-size="10" fill="#991b1b" font-weight="600">3. invoke() 返回当前 State 快照 → 进程退出</text>

  <text x="330" y="202" font-size="10" fill="#dc2626" font-weight="700">进程退出了！</text>
  <text x="330" y="218" font-size="10" fill="#dc2626">没有线程在等</text>
  <text x="330" y="234" font-size="10" fill="#dc2626">没有内存被占</text>

  <!-- === 阶段3：等待审批 === -->
  <text x="40" y="264" font-size="11" font-weight="700" fill="#334155">③ 等待人工审批（分钟级 ~ 小时级）</text>

  <rect x="40" y="276" width="180" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
  <text x="130" y="296" text-anchor="middle" font-size="10" fill="#1e40af">消息队列 + 通知系统</text>
  <line x1="220" y1="292" x2="250" y2="292" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="250" y="276" width="140" height="32" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="320" y="296" text-anchor="middle" font-size="10" fill="#713f12">审批人在审批页面操作</text>
  <line x1="390" y1="292" x2="420" y2="292" stroke="#eab308" stroke-width="1.5"/>
  <text x="440" y="288" font-size="9" fill="#64748b">超时回退：</text>
  <text x="440" y="302" font-size="9" fill="#ef4444">high→拒绝</text>
  <text x="500" y="302" font-size="9" fill="#f59e0b">medium→升级</text>
  <text x="568" y="302" font-size="9" fill="#16a34a">low→通过</text>

  <!-- === 阶段4：恢复执行 === -->
  <text x="40" y="332" font-size="11" font-weight="700" fill="#334155">④ 从 Checkpoint 恢复执行</text>

  <rect x="40" y="344" width="580" height="64" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="52" y="364" font-size="10" fill="#14532d" font-weight="600">invoke(None, config) → 框架从 Checkpoint 读取 State + 断点 → 从 review 节点继续</text>
  <text x="52" y="380" font-size="10" fill="#14532d">① update_state(config, {"approved": True}) — 写入审批结果</text>
  <text x="52" y="396" font-size="10" fill="#14532d">② 刷新时间敏感字段 → 注入目标提醒（防漂移）→ invoke(None, config) — 从断点继续执行</text>
</svg>
