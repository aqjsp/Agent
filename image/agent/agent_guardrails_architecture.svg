<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" width="900" height="560">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
  </defs>

  <rect width="900" height="560" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Agent 四层 Guardrails 纵深防御架构</text>

  <!-- User -->
  <rect x="50" y="80" width="120" height="50" rx="8" fill="#e2e8f0" stroke="#475569"/>
  <text x="110" y="111" text-anchor="middle" font-size="14" fill="#0f172a">用户输入</text>

  <!-- L1: Input Guard -->
  <rect x="220" y="75" width="180" height="60" rx="10" fill="url(#g1)" stroke="#d97706" stroke-width="2"/>
  <text x="310" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#92400e">L1 输入护栏</text>
  <text x="310" y="120" text-anchor="middle" font-size="12" fill="#78350f">注入模式识别 / 关键词过滤</text>

  <!-- LLM Core -->
  <rect x="450" y="75" width="160" height="60" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="530" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">LLM 决策核心</text>
  <text x="530" y="120" text-anchor="middle" font-size="12" fill="#475569">推理 / 工具选择</text>

  <!-- L2: Tool Guard -->
  <rect x="660" y="75" width="180" height="60" rx="10" fill="url(#g2)" stroke="#1d4ed8" stroke-width="2"/>
  <text x="750" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">L2 工具护栏</text>
  <text x="750" y="120" text-anchor="middle" font-size="12" fill="#1e3a8a">权限/参数/危险模式拦截</text>

  <!-- arrows top row -->
  <line x1="170" y1="105" x2="218" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="400" y1="105" x2="448" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="610" y1="105" x2="658" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Sandbox -->
  <rect x="660" y="180" width="180" height="80" rx="10" fill="url(#g4)" stroke="#dc2626" stroke-width="2"/>
  <text x="750" y="208" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">沙箱执行环境</text>
  <text x="750" y="228" text-anchor="middle" font-size="11" fill="#991b1b">文件/网络/系统调用/资源</text>
  <text x="750" y="246" text-anchor="middle" font-size="11" fill="#991b1b">隔离 (Docker/gVisor/Firecracker)</text>

  <!-- Tools -->
  <rect x="450" y="200" width="160" height="60" rx="10" fill="#fff" stroke="#475569"/>
  <text x="530" y="225" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">外部工具调用</text>
  <text x="530" y="244" text-anchor="middle" font-size="11" fill="#475569">DB / API / Shell / Email</text>

  <line x1="750" y1="135" x2="750" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="660" y1="230" x2="612" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Tool Output Sanitizer -->
  <rect x="220" y="200" width="180" height="60" rx="10" fill="url(#g1)" stroke="#d97706" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="310" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">工具返回过滤</text>
  <text x="310" y="244" text-anchor="middle" font-size="11" fill="#78350f">间接注入 / RAG 投毒防御</text>

  <line x1="450" y1="230" x2="402" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="310" y1="200" x2="310" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L3: Output Guard -->
  <rect x="450" y="320" width="160" height="60" rx="10" fill="url(#g3)" stroke="#15803d" stroke-width="2"/>
  <text x="530" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">L3 输出护栏</text>
  <text x="530" y="364" text-anchor="middle" font-size="11" fill="#166534">PII脱敏 / Schema / 泄漏检测</text>

  <line x1="530" y1="135" x2="530" y2="318" stroke="#475569" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr)"/>

  <!-- L4: HITL -->
  <rect x="220" y="320" width="180" height="60" rx="10" fill="url(#g4)" stroke="#dc2626" stroke-width="2"/>
  <text x="310" y="345" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">L4 人在回路 (HITL)</text>
  <text x="310" y="364" text-anchor="middle" font-size="11" fill="#991b1b">L3/L4 高危操作人工审批</text>

  <line x1="660" y1="200" x2="400" y2="350" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="455" y="295" font-size="10" fill="#dc2626">高危拦截</text>

  <!-- Final Output -->
  <rect x="660" y="320" width="180" height="60" rx="10" fill="#e2e8f0" stroke="#475569"/>
  <text x="750" y="354" text-anchor="middle" font-size="14" fill="#0f172a">用户/下游系统</text>

  <line x1="610" y1="350" x2="658" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Audit -->
  <rect x="50" y="430" width="800" height="80" rx="10" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <text x="450" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">审计日志层（横切关注点）</text>
  <text x="450" y="480" text-anchor="middle" font-size="12" fill="#475569">每一次输入、每一次工具调用、每一次拦截、每一次审批 → 不可篡改的事件流</text>
  <text x="450" y="498" text-anchor="middle" font-size="12" fill="#475569">用途：实时异常监控、事后回溯、合规审计、攻击模式提取 → 反哺评估集</text>

  <line x1="310" y1="380" x2="310" y2="428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="530" y1="380" x2="530" y2="428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="750" y1="380" x2="750" y2="428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Legend -->
  <text x="50" y="540" font-size="11" fill="#475569">原则：模型层做软防御，架构层做硬防御。任何一层被绕过，下一层兜底。</text>
</svg>
