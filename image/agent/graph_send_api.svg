<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 570">
  <rect width="840" height="570" rx="12" fill="#fafafa"/>
  <g transform="translate(30,30)">
    <!-- Title -->
    <text x="390" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Send API 并行执行与 Fan-out / Fan-in</text>
    <text x="390" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">动态生成 N 个并行任务，结果通过 Reducer 汇聚</text>

    <!-- Fan-out section -->
    <!-- Planner node -->
    <rect x="310" y="70" width="160" height="55" rx="10" fill="#3F51B5" opacity="0.85"/>
    <text x="390" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">planner_node</text>
    <text x="390" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e8e8ff">生成 3 个 Send 对象</text>

    <!-- Down arrows fan-out -->
    <line x1="340" y1="125" x2="170" y2="175" stroke="#3F51B5" stroke-width="1.5"/>
    <line x1="390" y1="125" x2="390" y2="175" stroke="#3F51B5" stroke-width="1.5"/>
    <line x1="440" y1="125" x2="610" y2="175" stroke="#3F51B5" stroke-width="1.5"/>

    <!-- Worker nodes -->
    <rect x="80" y="180" width="180" height="55" rx="8" fill="#E91E63" opacity="0.85"/>
    <text x="170" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">worker_node A</text>
    <text x="170" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffe0e0">state.section = "part1"</text>
    <!-- Parallel icon -->
    <rect x="220" y="180" width="50" height="22" rx="4" fill="#E91E63" opacity="0.3"/>
    <text x="245" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white">并行</text>

    <rect x="300" y="180" width="180" height="55" rx="8" fill="#E91E63" opacity="0.85"/>
    <text x="390" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">worker_node B</text>
    <text x="390" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffe0e0">state.section = "part2"</text>
    <!-- Parallel icon -->
    <rect x="440" y="180" width="50" height="22" rx="4" fill="#E91E63" opacity="0.3"/>
    <text x="465" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white">并行</text>

    <rect x="520" y="180" width="180" height="55" rx="8" fill="#E91E63" opacity="0.85"/>
    <text x="610" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">worker_node C</text>
    <text x="610" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffe0e0">state.section = "part3"</text>
    <!-- Parallel icon -->
    <rect x="660" y="180" width="50" height="22" rx="4" fill="#E91E63" opacity="0.3"/>
    <text x="685" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white">并行</text>

    <!-- Fan-in arrows -->
    <line x1="170" y1="235" x2="170" y2="290" stroke="#E91E63" stroke-width="1.5"/>
    <line x1="390" y1="235" x2="390" y2="290" stroke="#E91E63" stroke-width="1.5"/>
    <line x1="610" y1="235" x2="610" y2="290" stroke="#E91E63" stroke-width="1.5"/>

    <!-- Horizontal barrier line -->
    <line x1="120" y1="290" x2="660" y2="290" stroke="#FF9800" stroke-width="2"/>
    <rect x="290" y="277" width="200" height="22" rx="4" fill="#FF9800" opacity="0.2"/>
    <text x="390" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e65100" font-weight="bold">Barrier: 等待所有 Worker 完成</text>

    <!-- Aggregation node -->
    <rect x="310" y="310" width="160" height="55" rx="10" fill="#4CAF50" opacity="0.85"/>
    <text x="390" y="332" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">aggregate_node</text>
    <text x="390" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e0ffe0">Reducer 合并 sub_results</text>

    <!-- Code block -->
    <rect x="50" y="395" width="680" height="105" rx="8" fill="#263238"/>
    <text x="80" y="418" font-family="monospace" font-size="11" fill="#82b1ff">def continue_to_workers(state: OverallState):</text>
    <text x="90" y="436" font-family="monospace" font-size="11" fill="#a5d6ff">return [Send("worker_node", {"section": s}) for s in state["sections"]]</text>
    <text x="80" y="462" font-family="monospace" font-size="11" fill="#82b1ff">class OverallState(TypedDict):</text>
    <text x="90" y="480" font-family="monospace" font-size="11" fill="#c5e1a5">sub_results: Annotated[list[str], operator.add]  # Reducer 自动 append</text>
    <text x="80" y="498" font-family="monospace" font-size="11" fill="#a5d6ff">graph.add_conditional_edges("planner_node", continue_to_workers)</text>
  </g>
</svg>