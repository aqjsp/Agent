<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 540">
  <rect width="840" height="540" rx="12" fill="#fafafa"/>
  <g transform="translate(30,30)">
    <!-- Title -->
    <text x="390" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">条件边路由机制</text>
    <text x="390" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">state 驱动的动态路由是图编排区别于线性流水线的核心能力</text>

    <!-- Source node -->
    <rect x="340" y="65" width="100" height="50" rx="10" fill="#2196F3" opacity="0.85"/>
    <text x="390" y="85" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">classify</text>
    <text x="390" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e3f2fd">意图分类节点</text>

    <!-- Routing function box -->
    <rect x="290" y="130" width="200" height="42" rx="6" fill="#fff3e0" stroke="#FF9800" stroke-width="1.5"/>
    <text x="390" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#e65100">routing_function(state)</text>
    <text x="390" y="164" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#555">return state["next_action"]</text>

    <!-- Down arrows from function -->
    <line x1="340" y1="172" x2="200" y2="210" stroke="#FF9800" stroke-width="1.5"/>
    <line x1="390" y1="172" x2="390" y2="210" stroke="#FF9800" stroke-width="1.5"/>
    <line x1="440" y1="172" x2="580" y2="210" stroke="#FF9800" stroke-width="1.5"/>

    <!-- Target nodes -->
    <rect x="100" y="215" width="130" height="55" rx="10" fill="#E91E63" opacity="0.85"/>
    <text x="165" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">web_search</text>
    <text x="165" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffe0e0">condition: "search"</text>

    <rect x="325" y="215" width="130" height="55" rx="10" fill="#4CAF50" opacity="0.85"/>
    <text x="390" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">calc_exec</text>
    <text x="390" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e0ffe0">condition: "calculate"</text>

    <rect x="550" y="215" width="130" height="55" rx="10" fill="#9C27B0" opacity="0.85"/>
    <text x="615" y="238" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">fallback</text>
    <text x="615" y="256" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#f3e5f5">condition: "unknown"</text>

    <!-- Code block on right side -->
    <rect x="280" y="295" width="440" height="170" rx="8" fill="#263238"/>
    <text x="310" y="318" font-family="monospace" font-size="11" fill="#a5d6ff">graph.add_conditional_edges(</text>
    <text x="320" y="336" font-family="monospace" font-size="11" fill="#a5d6ff">"classify",          # 源节点</text>
    <text x="320" y="354" font-family="monospace" font-size="11" fill="#a5d6ff">routing_function,    # 路由函数(state) → str</text>
    <text x="320" y="372" font-family="monospace" font-size="11" fill="#a5d6ff">{</text>
    <text x="330" y="390" font-family="monospace" font-size="11" fill="#c5e1a5">"search": "web_search",</text>
    <text x="330" y="408" font-family="monospace" font-size="11" fill="#c5e1a5">"calculate": "calc_exec",</text>
    <text x="330" y="426" font-family="monospace" font-size="11" fill="#c5e1a5">"unknown": "fallback",</text>
    <text x="330" y="444" font-family="monospace" font-size="11" fill="#c5e1a5">"answer": END        # 直接结束</text>
    <text x="320" y="462" font-family="monospace" font-size="11" fill="#a5d6ff">})</text>

    <!-- Key insight -->
    <rect x="40" y="295" width="220" height="75" rx="8" fill="#e8f5e9"/>
    <text x="150" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">核心价值</text>
    <text x="55" y="338" font-family="Arial,sans-serif" font-size="11" fill="#555">不是 if-else 的图示化，</text>
    <text x="55" y="355" font-family="Arial,sans-serif" font-size="11" fill="#555">而是让 LLM 参与路由决策——</text>
    <text x="55" y="372" font-family="Arial,sans-serif" font-size="11" fill="#555">路由逻辑可以是模型输出本身</text>
  </g>
</svg>