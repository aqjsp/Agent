<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580">
  <rect width="980" height="580" rx="12" fill="#fafafa"/>
  <g transform="translate(70,60)">
    <text x="410" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">Embedding 语义空间示意</text>
    <text x="410" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">语义相近的词在向量空间中距离相近（降维至 2D 可视化）</text>

    <!-- Coordinate axes -->
    <line x1="80" y1="430" x2="820" y2="430" stroke="#ccc" stroke-width="1"/>
    <line x1="80" y1="60" x2="80" y2="430" stroke="#ccc" stroke-width="1"/>
    <text x="820" y="448" font-family="Arial,sans-serif" font-size="10" fill="#999">维度 1</text>
    <text x="50" y="65" font-family="Arial,sans-serif" font-size="10" fill="#999">维度 2</text>

    <!-- Cluster 1: Animals -->
    <ellipse cx="220" cy="180" rx="120" ry="90" fill="#e3f2fd" opacity="0.4" stroke="#2196F3" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="220" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1565c0">动物类</text>

    <circle cx="180" cy="150" r="6" fill="#2196F3"/>
    <text x="195" y="145" font-family="Arial,sans-serif" font-size="12" fill="#333">dog</text>

    <circle cx="220" cy="170" r="6" fill="#2196F3"/>
    <text x="235" y="165" font-family="Arial,sans-serif" font-size="12" fill="#333">cat</text>

    <circle cx="250" cy="200" r="6" fill="#2196F3"/>
    <text x="265" y="195" font-family="Arial,sans-serif" font-size="12" fill="#333">wolf</text>

    <circle cx="190" cy="210" r="6" fill="#2196F3"/>
    <text x="205" y="225" font-family="Arial,sans-serif" font-size="12" fill="#333">fox</text>

    <!-- Cluster 2: Royalty -->
    <ellipse cx="580" cy="170" rx="110" ry="80" fill="#e8f5e9" opacity="0.4" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="580" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2e7d32">王权类</text>

    <circle cx="550" cy="150" r="6" fill="#4CAF50"/>
    <text x="565" y="145" font-family="Arial,sans-serif" font-size="12" fill="#333">king</text>

    <circle cx="620" cy="150" r="6" fill="#4CAF50"/>
    <text x="635" y="145" font-family="Arial,sans-serif" font-size="12" fill="#333">queen</text>

    <circle cx="560" cy="200" r="6" fill="#4CAF50"/>
    <text x="575" y="195" font-family="Arial,sans-serif" font-size="12" fill="#333">prince</text>

    <circle cx="620" cy="200" r="6" fill="#4CAF50"/>
    <text x="635" y="195" font-family="Arial,sans-serif" font-size="12" fill="#333">princess</text>

    <!-- Cluster 3: Food -->
    <ellipse cx="200" cy="370" rx="110" ry="60" fill="#fff3e0" opacity="0.4" stroke="#FF9800" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="200" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e65100">食物类</text>

    <circle cx="170" cy="365" r="6" fill="#FF9800"/>
    <text x="185" y="360" font-family="Arial,sans-serif" font-size="12" fill="#333">apple</text>

    <circle cx="230" cy="365" r="6" fill="#FF9800"/>
    <text x="245" y="360" font-family="Arial,sans-serif" font-size="12" fill="#333">orange</text>

    <circle cx="190" cy="390" r="6" fill="#FF9800"/>
    <text x="205" y="398" font-family="Arial,sans-serif" font-size="12" fill="#333">banana</text>

    <!-- Analogy arrow: king - man + woman ≈ queen -->
    <line x1="550" y1="155" x2="420" y2="155" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <text x="480" y="148" text-anchor="middle" font-family="monospace" font-size="9" fill="#c62828">- man</text>

    <line x1="420" y1="155" x2="420" y2="265" stroke="#c62828" stroke-width="1.5"/>
    <text x="435" y="220" font-family="monospace" font-size="9" fill="#c62828">+ woman</text>

    <line x1="420" y1="265" x2="610" y2="155" stroke="#c62828" stroke-width="1.5" marker-end="url(#arrowRed)"/>

    <rect x="380" y="260" width="200" height="25" rx="4" fill="#ffebee"/>
    <text x="480" y="278" text-anchor="middle" font-family="monospace" font-size="10" fill="#c62828">king - man + woman ≈ queen</text>

    <!-- Similarity labels -->
    <line x1="190" y1="155" x2="545" y2="150" stroke="#999" stroke-width="0.5" stroke-dasharray="3,3"/>
    <text x="370" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#999">cosine_sim ≈ 0.3（语义不相关）</text>

    <line x1="220" y1="175" x2="245" y2="200" stroke="#4CAF50" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="250" y="185" font-family="Arial,sans-serif" font-size="9" fill="#2e7d32">cosine_sim ≈ 0.85（语义相近）</text>

    <defs>
      <marker id="arrowRed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#c62828"/>
      </marker>
    </defs>
  </g>
</svg>