<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="920" height="620" rx="16" fill="#f8fafc"/>
  <text x="460" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Agent 舱壁隔离架构</text>
  <text x="460" y="68" text-anchor="middle" font-size="13" fill="#64748b">一个 Worker 的错误输出、慢调用、权限风险，不应该进入全局系统</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
    <marker id="block" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <circle cx="5" cy="5" r="4" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Parent graph -->
  <rect x="280" y="100" width="360" height="110" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#1d4ed8">Parent Graph</text>
  <text x="460" y="158" text-anchor="middle" font-size="12" fill="#334155">只保存 verified facts / decisions</text>
  <text x="460" y="180" text-anchor="middle" font-size="12" fill="#334155">不直接接收 Worker 原始输出</text>

  <!-- Sanitizer / validator -->
  <rect x="340" y="260" width="240" height="80" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="460" y="292" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Mapping + Validation</text>
  <text x="460" y="316" text-anchor="middle" font-size="12" fill="#334155">显式字段映射 / schema 校验 / 置信度过滤</text>

  <path d="M460 260 L460 210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Worker compartments -->
  <rect x="60" y="400" width="220" height="150" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="170" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">Research Worker</text>
  <text x="170" y="455" text-anchor="middle" font-size="12" fill="#334155">Private State</text>
  <text x="170" y="477" text-anchor="middle" font-size="12" fill="#334155">raw results / candidate facts</text>
  <text x="170" y="510" text-anchor="middle" font-size="11" fill="#64748b">权限：search, read_docs</text>

  <rect x="350" y="400" width="220" height="150" rx="16" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <text x="460" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#7e22ce">Code Worker</text>
  <text x="460" y="455" text-anchor="middle" font-size="12" fill="#334155">Private State</text>
  <text x="460" y="477" text-anchor="middle" font-size="12" fill="#334155">test logs / patch candidates</text>
  <text x="460" y="510" text-anchor="middle" font-size="11" fill="#64748b">权限：read_repo, run_tests</text>

  <rect x="640" y="400" width="220" height="150" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="750" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">Risky Worker</text>
  <text x="750" y="455" text-anchor="middle" font-size="12" fill="#334155">Sandbox State</text>
  <text x="750" y="477" text-anchor="middle" font-size="12" fill="#334155">untrusted output</text>
  <text x="750" y="510" text-anchor="middle" font-size="11" fill="#64748b">权限：最小化 / 禁止写外部系统</text>

  <!-- Arrows to validator -->
  <path d="M170 400 C200 335, 280 310, 340 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M460 400 L460 340" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M750 400 C720 335, 640 310, 580 300" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Blocked direct arrows -->
  <path d="M750 390 C750 245, 635 170, 640 140" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#block)"/>
  <text x="720" y="250" font-size="12" font-weight="700" fill="#ef4444">禁止直接写父图 State</text>

  <!-- Isolation labels -->
  <rect x="70" y="235" width="160" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="150" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">资源隔离</text>
  <text x="150" y="282" text-anchor="middle" font-size="11" fill="#64748b">独立线程池 / 连接池</text>
  <text x="150" y="300" text-anchor="middle" font-size="11" fill="#64748b">慢依赖不拖垮全局</text>

  <rect x="690" y="235" width="160" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="770" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">上下文隔离</text>
  <text x="770" y="282" text-anchor="middle" font-size="11" fill="#64748b">raw output 不广播</text>
  <text x="770" y="300" text-anchor="middle" font-size="11" fill="#64748b">只共享验证摘要</text>

  <text x="460" y="590" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">舱壁隔离的核心：Worker 可以失败，但失败不能越过边界污染父图</text>
</svg>
