<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#16a34a"/></linearGradient></defs>
<style>.h{font-size:20px;font-weight:700;fill:#0f172a}.t{font-size:14px;font-weight:600;fill:#0f172a}.s{font-size:12px;fill:#475569}.e{font-size:12px;fill:#b91c1c}.l{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#a)}.x{stroke:#dc2626;stroke-width:1.8;fill:none;marker-end:url(#a);stroke-dasharray:5 3}.c{text-anchor:middle}</style>
<rect width="960" height="560" fill="#fff"/>
<text x="30" y="36" class="h">沙箱：隔离强度光谱与「文件系统 + 网络」双隔离</text>

<rect x="30" y="58" width="900" height="12" rx="6" fill="url(#g)"/>
<text x="30" y="88" class="s">弱（启动快、共享内核）</text><text x="930" y="88" class="s" text-anchor="end">强（独立内核、硬件边界）</text>
<g class="s c">
<rect x="30" y="100" width="168" height="110" rx="8" fill="#fffbeb" stroke="#d97706"/>
<text x="114" y="122" class="t c">OS 原语</text><text x="114" y="144">Seatbelt · bubblewrap</text><text x="114" y="162">Landlock · seccomp</text><text x="114" y="188">Claude Code · Codex 本地</text>
<rect x="213" y="100" width="168" height="110" rx="8" fill="#fffbeb" stroke="#d97706"/>
<text x="297" y="122" class="t c">V8 isolate</text><text x="297" y="144">只跑 JS/TS</text><text x="297" y="162">极快启动</text><text x="297" y="188">Cloudflare Dynamic Workers</text>
<rect x="396" y="100" width="168" height="110" rx="8" fill="#fefce8" stroke="#ca8a04"/>
<text x="480" y="122" class="t c">容器</text><text x="480" y="144">namespace + cgroup</text><text x="480" y="162">内核漏洞 = 逃逸</text><text x="480" y="188">Daytona（默认）</text>
<rect x="579" y="100" width="168" height="110" rx="8" fill="#ecfccb" stroke="#65a30d"/>
<text x="663" y="122" class="t c">gVisor</text><text x="663" y="144">用户态拦截 syscall</text><text x="663" y="162">强于容器</text><text x="663" y="188">Modal Sandboxes</text>
<rect x="762" y="100" width="168" height="110" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="846" y="122" class="t c">microVM</text><text x="846" y="144">Firecracker 等</text><text x="846" y="162">冷启 125–200ms</text><text x="846" y="176">快照恢复 5–30ms</text><text x="846" y="198">E2B · Vercel · AgentCore</text>
</g>

<rect x="30" y="232" width="560" height="306" rx="10" fill="#f8fafc" stroke="#64748b"/>
<text x="46" y="258" class="t">Brain 与 Hands 分离 + 出口代理注入凭证</text>
<rect x="46" y="276" width="150" height="110" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="121" y="302" class="t c">Harness</text><text x="121" y="324" class="s c">在沙箱之外</text><text x="121" y="346" class="s c">持有会话日志</text><text x="121" y="368" class="s c">无长期凭证</text>
<rect x="236" y="276" width="160" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="316" y="302" class="t c">Sandbox</text><text x="316" y="324" class="s c">读写仅限工作区</text><text x="316" y="346" class="s c">无凭证、无直连网络</text><text x="316" y="368" class="s c">模型代码在这里跑</text>
<rect x="436" y="276" width="140" height="110" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="506" y="302" class="t c">Egress Proxy</text><text x="506" y="324" class="s c">域名白名单</text><text x="506" y="346" class="s c">新域名问用户</text><text x="506" y="368" class="s c">在这里加 token</text>
<path d="M196 330 L232 330" class="l"/><text x="214" y="320" class="s c">execute</text>
<path d="M396 330 L432 330" class="l"/><text x="414" y="320" class="s c">UDS</text>
<rect x="436" y="420" width="140" height="44" rx="8" fill="#fff" stroke="#64748b"/><text x="506" y="447" class="s c">github.com 等</text>
<path d="M506 386 L506 416" class="l"/>
<rect x="236" y="420" width="160" height="44" rx="8" fill="#fff" stroke="#dc2626"/><text x="316" y="447" class="e c">~/.ssh · 攻击者服务器</text>
<path d="M316 386 L316 416" class="x"/><text x="326" y="406" class="e">✕</text>
<text x="46" y="492" class="s">只有网络隔离：改掉沙箱配置逃出去；只有文件隔离：把 ~/.ssh 外传。两者缺一不可。</text>
<text x="46" y="514" class="s">Claude Code 内部数据：这样划出自由区后，权限弹窗减少 84%。</text>

<rect x="610" y="232" width="320" height="306" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="626" y="258" class="t">控制面也是攻击面</text>
<text x="626" y="282" class="s">CVE-2026-82533（CVSS 9.4）</text>
<text x="626" y="302" class="s">DeepSeek Harness 本地控制 API</text>
<rect x="626" y="318" width="110" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="681" y="344" class="s c">沙箱内 Agent</text><text x="681" y="364" class="s c">curl localhost</text>
<rect x="796" y="318" width="118" height="60" rx="8" fill="#fff" stroke="#dc2626"/><text x="855" y="344" class="s c">控制 API</text><text x="855" y="364" class="s c">信任 Host 头</text>
<path d="M736 348 L792 348" class="x"/>
<text x="626" y="406" class="e">→ 一条命令关闭自身沙箱、免审批执行</text>
<text x="626" y="436" class="t">教训</text>
<text x="626" y="458" class="s">· 沙箱能出网，就能打到 localhost 服务</text>
<text x="626" y="480" class="s">· 校验连接真实来源，不信请求头</text>
<text x="626" y="502" class="s">· 「关沙箱 / 改审批」走模型够不着</text>
<text x="626" y="522" class="s">　的通道（TTY、带外签名）</text>
</svg>
