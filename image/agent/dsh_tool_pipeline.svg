<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" width="940" height="500">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
  </defs>

  <rect width="940" height="500" rx="16" fill="url(#bg5)"/>
  <text x="470" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">工具不是「拿到函数名就调用」</text>
  <text x="470" y="66" text-anchor="middle" font-size="12" fill="#64748b">文件系统、Bash、子进程共享同一套沙箱策略；守卫拒绝后不能被后续插件重新放行</text>

  <rect x="40" y="100" width="140" height="88" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="110" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">① 前置策略</text>
  <text x="110" y="160" text-anchor="middle" font-size="11" fill="#1e40af">参数检查 / 范围</text>

  <rect x="210" y="100" width="150" height="88" rx="10" fill="url(#ok)" stroke="#15803d"/>
  <text x="285" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">② 单调守卫</text>
  <text x="285" y="160" text-anchor="middle" font-size="11" fill="#166534">拒绝不可回放</text>

  <rect x="390" y="100" width="150" height="88" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="465" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">③ 执行包装</text>
  <text x="465" y="160" text-anchor="middle" font-size="11" fill="#92400e">沙箱内真正动手</text>

  <rect x="570" y="100" width="150" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="645" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">④ 后置处理</text>
  <text x="645" y="160" text-anchor="middle" font-size="11" fill="#6d28d9">整理结果 / 截断</text>

  <rect x="750" y="100" width="150" height="88" rx="10" fill="#e2e8f0" stroke="#475569"/>
  <text x="825" y="136" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">⑤ 写入日志</text>
  <text x="825" y="160" text-anchor="middle" font-size="11" fill="#334155">含取消与拒绝</text>

  <line x1="180" y1="144" x2="210" y2="144" stroke="#334155" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="360" y1="144" x2="390" y2="144" stroke="#334155" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="540" y1="144" x2="570" y2="144" stroke="#334155" stroke-width="1.6" marker-end="url(#arr5)"/>
  <line x1="720" y1="144" x2="750" y2="144" stroke="#334155" stroke-width="1.6" marker-end="url(#arr5)"/>

  <rect x="40" y="228" width="420" height="196" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="1.6"/>
  <text x="250" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">默认姿态</text>
  <text x="70" y="296" font-size="13" fill="#334155">workspace-write：改文件、跑命令锁在工作区</text>
  <text x="70" y="322" font-size="13" fill="#334155">扩大权限走 ask 审批，且必须说明原因</text>
  <text x="70" y="348" font-size="13" fill="#334155">隔离无法确认生效 → 拒绝执行</text>
  <text x="70" y="374" font-size="13" fill="#334155">失败关闭，不静默退化成裸跑</text>
  <text x="70" y="400" font-size="13" fill="#334155">只读可并行，写操作为屏障</text>

  <rect x="480" y="228" width="420" height="196" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="690" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">必须显式打开</text>
  <text x="510" y="296" font-size="13" fill="#334155">danger-full-access 不会伪装成兼容选项</text>
  <text x="510" y="322" font-size="13" fill="#334155">创造模式可运行模型写的插件代码</text>
  <text x="510" y="348" font-size="13" fill="#334155">密钥不进 cordis.yml，不进会话日志</text>
  <text x="510" y="374" font-size="13" fill="#334155">配置补丁是整段替换，不是深合并</text>
  <text x="510" y="400" font-size="13" fill="#334155">模型提议行动，Harness 决定能否发生</text>

  <text x="470" y="462" text-anchor="middle" font-size="12" fill="#475569">这套设计消不掉本地执行的全部风险，但把「能不能做」从模型手里拿回到了系统层。</text>
</svg>
