<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <rect width="960" height="620" rx="12" fill="#fafafa"/>
  <g transform="translate(60,55)">
    <text x="420" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">子图 State：共享 vs 隔离</text>
    <text x="420" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">共享 = 简单但有隐患 │ 隔离 = 安全但需显式映射</text>

    <rect x="30" y="70" width="390" height="420" rx="10" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
    <text x="225" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">共享 State</text>
    <text x="225" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="#1565c0">父子图使用同一个 State 类型</text>

    <rect x="60" y="135" width="330" height="130" rx="8" fill="#bbdefb" stroke="#2196F3" stroke-width="1"/>
    <text x="225" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#0d47a1">MainGraph (SharedState)</text>

    <rect x="80" y="170" width="80" height="32" rx="6" fill="#2196F3" opacity="0.7"/>
    <text x="120" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="white">reasoning</text>
    <rect x="175" y="170" width="80" height="32" rx="6" fill="#9C27B0" opacity="0.7"/>
    <text x="215" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="white">research</text>
    <rect x="270" y="170" width="90" height="32" rx="6" fill="#4CAF50" opacity="0.7"/>
    <text x="315" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="white">write</text>

    <rect x="85" y="215" width="280" height="35" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="225" y="237" text-anchor="middle" font-family="monospace" font-size="9" fill="#0d47a1">messages | research_results | final_answer</text>

    <rect x="120" y="275" width="210" height="95" rx="8" fill="#c5cae9" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="225" y="298" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#6a1b9a">Research SubGraph</text>
    <rect x="140" y="310" width="75" height="26" rx="4" fill="#9C27B0" opacity="0.6"/>
    <text x="177" y="327" text-anchor="middle" font-family="monospace" font-size="9" fill="white">search</text>
    <rect x="228" y="310" width="85" height="26" rx="4" fill="#9C27B0" opacity="0.6"/>
    <text x="270" y="327" text-anchor="middle" font-family="monospace" font-size="9" fill="white">summarize</text>
    <text x="225" y="358" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a1b9a">能读写所有 SharedState 字段！</text>

    <path d="M 225,362 L 225,390" stroke="#9C27B0" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="225" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#c62828">子图可以意外修改 messages</text>
    <text x="225" y="428" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#c62828">（它不该碰的字段！）</text>

    <rect x="55" y="448" width="340" height="30" rx="6" fill="#e3f2fd"/>
    <text x="225" y="468" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1565c0">通信零成本 │ 但隐式耦合 → 子图多了必出事</text>

    <rect x="460" y="70" width="400" height="420" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
    <text x="660" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#2e7d32">隔离 State</text>
    <text x="660" y="118" text-anchor="middle" font-family="monospace" font-size="9" fill="#2e7d32">父子图各有独立的 State 类型</text>

    <rect x="490" y="135" width="340" height="115" rx="8" fill="#c8e6c9" stroke="#4CAF50" stroke-width="1"/>
    <text x="660" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1b5e20">MainGraph (MainState)</text>

    <rect x="510" y="170" width="80" height="32" rx="6" fill="#4CAF50" opacity="0.7"/>
    <text x="550" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="white">reasoning</text>
    <rect x="605" y="170" width="80" height="32" rx="6" fill="#9C27B0" opacity="0.7"/>
    <text x="645" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="white">research</text>
    <rect x="700" y="170" width="80" height="32" rx="6" fill="#2196F3" opacity="0.7"/>
    <text x="740" y="190" text-anchor="middle" font-family="monospace" font-size="9" fill="white">write</text>

    <rect x="520" y="215" width="280" height="22" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="660" y="231" text-anchor="middle" font-family="monospace" font-size="9" fill="#1b5e20">messages | research_result | final_answer</text>

    <rect x="500" y="255" width="320" height="65" rx="6" fill="#fff3e0" stroke="#FF9800" stroke-width="1.5"/>
    <text x="660" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#e65100">显式 State 转换层</text>
    <text x="530" y="296" font-family="monospace" font-size="8" fill="#555">入: MainState → {"query": state["messages"][-1]}</text>
    <text x="530" y="310" font-family="monospace" font-size="8" fill="#555">出: {"research_result": sub_result["summary"]}</text>

    <rect x="545" y="340" width="230" height="85" rx="8" fill="#c5cae9" stroke="#9C27B0" stroke-width="1.5"/>
    <text x="660" y="362" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#6a1b9a">Research SubGraph</text>
    <rect x="565" y="375" width="75" height="26" rx="4" fill="#9C27B0" opacity="0.6"/>
    <text x="602" y="392" text-anchor="middle" font-family="monospace" font-size="9" fill="white">search</text>
    <rect x="650" y="375" width="100" height="26" rx="4" fill="#9C27B0" opacity="0.6"/>
    <text x="700" y="392" text-anchor="middle" font-family="monospace" font-size="9" fill="white">summarize</text>
    <text x="660" y="418" text-anchor="middle" font-family="monospace" font-size="8" fill="#6a1b9a">只能看到 query | sources | summary</text>

    <rect x="545" y="438" width="230" height="22" rx="4" fill="#c8e6c9"/>
    <text x="660" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">子图无法接触 messages — 安全隔离</text>

    <rect x="490" y="470" width="340" height="22" rx="6" fill="#e8f5e9"/>
    <text x="660" y="486" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">完全自治 │ 可独立测试复用 │ 但转换代码有维护成本</text>
  </g>
</svg>
