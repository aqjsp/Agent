<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker></defs>
<style>.h{font-size:20px;font-weight:700;fill:#0f172a}.t{font-size:15px;font-weight:600;fill:#0f172a}.s{font-size:12.5px;fill:#475569}.l{stroke:#475569;stroke-width:1.5;fill:none;marker-end:url(#a)}.c{text-anchor:middle}</style>
<rect width="960" height="500" fill="#fff"/>
<text x="40" y="42" class="h">Agent 系统的四层：Framework / Harness / Runtime / Sandbox</text>

<rect x="40" y="70" width="600" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
<text x="60" y="100" class="t">目的层：指令 + 工具 + 模型</text>
<text x="60" y="124" class="s">要 Agent 干什么、能用哪些工具、用哪个模型</text>

<rect x="40" y="158" width="600" height="100" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="60" y="188" class="t">Harness：一个 turn 之内的循环</text>
<text x="60" y="212" class="s">调模型 → 执行工具 → 回灌结果 → 管理与压缩上下文</text>
<text x="60" y="236" class="s">Claude Code / Agent SDK · Codex · OpenCode · Deep Agents · DeepSeek Harness</text>

<rect x="40" y="274" width="600" height="156" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="60" y="304" class="t">Runtime：Agent 的一生（跨 turn、跨进程、跨部署）</text>
<g class="s">
<rect x="60" y="318" width="100" height="34" rx="17" fill="#fff" stroke="#d97706"/><text x="110" y="340" class="c">状态</text>
<rect x="172" y="318" width="100" height="34" rx="17" fill="#fff" stroke="#d97706"/><text x="222" y="340" class="c">身份</text>
<rect x="284" y="318" width="100" height="34" rx="17" fill="#fff" stroke="#d97706"/><text x="334" y="340" class="c">唤醒</text>
<rect x="396" y="318" width="100" height="34" rx="17" fill="#fff" stroke="#d97706"/><text x="446" y="340" class="c">伸缩</text>
<rect x="508" y="318" width="100" height="34" rx="17" fill="#fff" stroke="#d97706"/><text x="558" y="340" class="c">恢复</text>
</g>
<text x="60" y="384" class="s">AgentCore Runtime · Claude Managed Agents · Cloudflare Agents · LangSmith Deployment</text>
<text x="60" y="408" class="s">持久执行引擎：Temporal · Restate · DBOS · Inngest · Cloudflare Workflows</text>

<rect x="690" y="70" width="230" height="120" rx="10" fill="#fff" stroke="#7c3aed" stroke-dasharray="6 4" stroke-width="1.5"/>
<text x="710" y="100" class="t">Framework</text>
<text x="710" y="124" class="s">搭 Harness 的零件库</text>
<text x="710" y="146" class="s">LangGraph · CrewAI · Mastra</text>
<text x="710" y="168" class="s">Pydantic AI · Google ADK</text>
<path d="M690 160 L646 196" class="l"/>
<text x="652" y="160" class="s" fill="#7c3aed">产出</text>

<rect x="690" y="290" width="230" height="140" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="710" y="320" class="t">Sandbox</text>
<text x="710" y="344" class="s">隔离模型写出来的代码</text>
<text x="710" y="366" class="s">E2B · Modal · Daytona</text>
<text x="710" y="388" class="s">Vercel · Cloudflare Sandboxes</text>
<text x="710" y="410" class="s">Seatbelt · bubblewrap（本地）</text>
<path d="M640 236 L686 318" class="l"/>
<text x="662" y="262" class="s" fill="#16a34a">模型生成</text>
<text x="662" y="278" class="s" fill="#16a34a">的代码</text>

<text x="40" y="468" class="s">Framework 不是独立的一层，而是产出 Harness 的一种方式；Sandbox 挂在旁边，因为它服务的是模型的代码，不是你的代码。</text>
</svg>
