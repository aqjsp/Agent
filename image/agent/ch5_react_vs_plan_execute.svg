<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <rect x="0" y="0" width="800" height="460" rx="12" fill="#f8f9fa"/>
  <rect x="0" y="0" width="800" height="460" rx="12" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#1565c0"/>
    </marker>
    <marker id="ao2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e65100"/>
    </marker>
  </defs>
  <g transform="translate(30,30)">

  <!-- ReAct 模式 -->
  <rect x="10" y="10" width="340" height="360" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="180" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#1565c0">ReAct：边做边想</text>

  <!-- 用户输入 -->
  <rect x="40" y="55" width="280" height="30" rx="6" fill="#bbdefb"/>
  <text x="180" y="75" text-anchor="middle" font-size="11">用户: "北京上海哪个适合户外活动？"</text>

  <!-- 循环 -->
  <rect x="40" y="100" width="280" height="36" rx="6" fill="#90caf9" stroke="#1565c0"/>
  <text x="180" y="120" text-anchor="middle" font-size="11" font-weight="bold">Thought: 需要天气 → get_weather(北京)</text>
  <line x1="180" y1="136" x2="180" y2="150" stroke="#1565c0" stroke-width="2" marker-end="url(#ar2)"/>

  <rect x="40" y="150" width="280" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="180" y="170" text-anchor="middle" font-size="11">Observation: 北京 28°C, 晴</text>
  <line x1="180" y1="186" x2="180" y2="200" stroke="#1565c0" stroke-width="2" marker-end="url(#ar2)"/>

  <rect x="40" y="200" width="280" height="36" rx="6" fill="#90caf9" stroke="#1565c0"/>
  <text x="180" y="220" text-anchor="middle" font-size="11" font-weight="bold">Thought: 还要上海 → get_weather(上海)</text>
  <line x1="180" y1="236" x2="180" y2="250" stroke="#1565c0" stroke-width="2" marker-end="url(#ar2)"/>

  <rect x="40" y="250" width="280" height="36" rx="6" fill="#c8e6c9" stroke="#2e7d32"/>
  <text x="180" y="270" text-anchor="middle" font-size="11">Observation: 上海 32°C, 阴</text>
  <line x1="180" y1="286" x2="180" y2="300" stroke="#1565c0" stroke-width="2" marker-end="url(#ar2)"/>

  <rect x="40" y="300" width="280" height="36" rx="6" fill="#fff9c4" stroke="#f9a825"/>
  <text x="180" y="320" text-anchor="middle" font-size="11">Thought: 信息够了 → 综合建议</text>

  <text x="180" y="358" text-anchor="middle" font-size="11" fill="#1565c0">灵活，但缺乏全局视角</text>

  <!-- Plan-and-Execute 模式 -->
  <rect x="370" y="10" width="340" height="360" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="540" y="38" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">Plan-and-Execute：先想后做</text>

  <!-- 用户输入 -->
  <rect x="400" y="55" width="280" height="30" rx="6" fill="#ffe0b2"/>
  <text x="540" y="75" text-anchor="middle" font-size="11">用户: "北京上海哪个适合户外活动？"</text>

  <!-- Plan 阶段 -->
  <rect x="400" y="95" width="280" height="28" rx="6" fill="#e65100" stroke="#bf360c"/>
  <text x="540" y="114" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Plan 阶段</text>
  <line x1="540" y1="123" x2="540" y2="137" stroke="#e65100" stroke-width="2" marker-end="url(#ao2)"/>

  <rect x="400" y="137" width="280" height="22" rx="4" fill="#ffcc80"/>
  <text x="540" y="152" text-anchor="middle" font-size="10">1. 获取北京天气+空气质量</text>
  <rect x="400" y="163" width="280" height="22" rx="4" fill="#ffcc80"/>
  <text x="540" y="178" text-anchor="middle" font-size="10">2. 获取上海天气+空气质量</text>
  <rect x="400" y="189" width="280" height="22" rx="4" fill="#ffcc80"/>
  <text x="540" y="204" text-anchor="middle" font-size="10">3. 对比分析 → 4. 给出建议</text>

  <!-- Execute 阶段 -->
  <line x1="540" y1="211" x2="540" y2="225" stroke="#e65100" stroke-width="2" marker-end="url(#ao2)"/>
  <rect x="400" y="225" width="280" height="28" rx="6" fill="#2e7d32" stroke="#1b5e20"/>
  <text x="540" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="white">Execute 阶段</text>
  <line x1="540" y1="253" x2="540" y2="267" stroke="#e65100" stroke-width="2" marker-end="url(#ao2)"/>

  <rect x="400" y="267" width="280" height="22" rx="4" fill="#c8e6c9"/>
  <text x="540" y="282" text-anchor="middle" font-size="10">Step1: get_weather + search_web</text>
  <rect x="400" y="293" width="280" height="22" rx="4" fill="#c8e6c9"/>
  <text x="540" y="308" text-anchor="middle" font-size="10">Step2: get_weather + search_web</text>

  <line x1="540" y1="315" x2="540" y2="329" stroke="#e65100" stroke-width="2" marker-end="url(#ao2)"/>
  <rect x="400" y="329" width="280" height="30" rx="6" fill="#fff9c4" stroke="#f9a825"/>
  <text x="540" y="349" text-anchor="middle" font-size="11">Step3-4: LLM 对比分析+建议</text>

  <text x="540" y="373" text-anchor="middle" font-size="11" fill="#e65100">有全局视角，但不够灵活</text>
  </g>
</svg>
