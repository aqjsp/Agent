<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="920" height="540" rx="16" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">主体授权 vs 任务授权</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">工具名单挂在身份上会求并；票挂在这一次请求上，用完即废</text>

  <rect x="28" y="84" width="420" height="420" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="238" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#1d4ed8">主体授权 · RBAC</text>
  <rect x="70" y="136" width="336" height="52" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="238" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">ops_agent 身份</text>
  <text x="238" y="176" text-anchor="middle" font-size="11" fill="#1e40af">预发重启 · 只读 SQL · 发布？</text>
  <rect x="70" y="208" width="150" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="145" y="234" text-anchor="middle" font-size="12" fill="#0f172a">所有会话共用</text>
  <rect x="256" y="208" width="150" height="44" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="331" y="234" text-anchor="middle" font-size="12" fill="#0f172a">工具表是并集</text>
  <text x="238" y="280" text-anchor="middle" font-size="13" fill="#334155">审计对得上「哪类 Agent」</text>
  <text x="238" y="304" text-anchor="middle" font-size="13" fill="#334155">对不上「这一单、这一次」</text>
  <text x="238" y="340" text-anchor="middle" font-size="12" fill="#1d4ed8">该管：Agent 类型 × 租户 × 环境</text>
  <text x="238" y="368" text-anchor="middle" font-size="12" fill="#b45309">死法：中心做成超集 · Swarm 交接求并</text>
  <text x="238" y="396" text-anchor="middle" font-size="12" fill="#b45309">同一进程服务所有用户，串号</text>
  <text x="238" y="432" text-anchor="middle" font-size="12" fill="#64748b">预发和线上不是同一套凭证</text>
  <text x="238" y="456" text-anchor="middle" font-size="12" fill="#64748b">主体是上限，不是这一次的闸</text>

  <rect x="472" y="84" width="420" height="420" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="682" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">任务授权 · Capability</text>
  <rect x="514" y="136" width="336" height="52" rx="10" fill="#d1fae5" stroke="#059669"/>
  <text x="682" y="158" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">短命票 cap:7f3a</text>
  <text x="682" y="176" text-anchor="middle" font-size="11" fill="#047857">user=u12 · order:9821 · orders.read · 5min</text>
  <rect x="514" y="208" width="150" height="44" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="589" y="234" text-anchor="middle" font-size="12" fill="#065f46">只能缩小派生</text>
  <rect x="700" y="208" width="150" height="44" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="775" y="234" text-anchor="middle" font-size="12" fill="#065f46">用一次可作废</text>
  <text x="682" y="280" text-anchor="middle" font-size="13" fill="#334155">工具护栏验的是这张票</text>
  <text x="682" y="304" text-anchor="middle" font-size="13" fill="#334155">不是 Agent 名字，也不是 Prompt</text>
  <text x="682" y="340" text-anchor="middle" font-size="12" fill="#047857">HITL = 签发高危 action，不是改人设</text>
  <text x="682" y="368" text-anchor="middle" font-size="12" fill="#b45309">死法：票永不过期 · 全文塞进 prompt</text>
  <text x="682" y="396" text-anchor="middle" font-size="12" fill="#b45309">Worker 派生时放大 actions</text>
  <text x="682" y="432" text-anchor="middle" font-size="12" fill="#64748b">审计四元组：thread · agent · cap · action</text>
  <text x="682" y="456" text-anchor="middle" font-size="12" fill="#64748b">Agent 票是登录态上的收缩，不是替代</text>
</svg>
