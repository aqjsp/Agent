<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <rect width="1000" height="620" rx="12" fill="#fafafa"/>
  <g transform="translate(70,60)">
    <text x="420" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">RAG 完整架构流程</text>
    <text x="420" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">离线索引 + 在线检索 → 增强生成</text>

    <!-- Left: Offline indexing -->
    <rect x="30" y="65" width="350" height="260" rx="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="205" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#555">离线索引阶段</text>

    <!-- Doc → Chunks -->
    <rect x="55" y="100" width="130" height="40" rx="6" fill="#e3f2fd" stroke="#2196F3" stroke-width="1"/>
    <text x="120" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1565c0">文档集合</text>
    <text x="120" y="132" text-anchor="middle" font-family="monospace" font-size="8" fill="#1565c0">PDF/MD/HTML</text>

    <line x1="190" y1="120" x2="210" y2="120" stroke="#999" stroke-width="1"/>
    <polygon points="210,120 205,115 205,125" fill="#999"/>

    <rect x="215" y="100" width="140" height="40" rx="6" fill="#fff3e0" stroke="#FF9800" stroke-width="1"/>
    <text x="285" y="118" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#e65100">文档切分</text>
    <text x="285" y="132" text-anchor="middle" font-family="monospace" font-size="8" fill="#e65100">Chunking 500-1K tok</text>

    <line x1="285" y1="145" x2="285" y2="163" stroke="#999" stroke-width="1"/>
    <polygon points="285,163 280,158 290,158" fill="#999"/>

    <rect x="215" y="168" width="140" height="40" rx="6" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1"/>
    <text x="285" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2e7d32">Embedding 编码</text>
    <text x="285" y="200" text-anchor="middle" font-family="monospace" font-size="8" fill="#2e7d32">text → vector[1536]</text>

    <line x1="285" y1="213" x2="285" y2="231" stroke="#999" stroke-width="1"/>
    <polygon points="285,231 280,226 290,226" fill="#999"/>

    <rect x="215" y="236" width="140" height="40" rx="6" fill="#e8eaf6" stroke="#1a237e" stroke-width="1"/>
    <text x="285" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#1a237e">向量存储</text>
    <text x="285" y="268" text-anchor="middle" font-family="monospace" font-size="8" fill="#1a237e">Pinecone/Chroma</text>

    <rect x="55" y="236" width="130" height="40" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1"/>
    <text x="120" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c62828">元数据存储</text>
    <text x="120" y="268" text-anchor="middle" font-family="monospace" font-size="8" fill="#c62828">source/page/日期</text>

    <line x1="190" y1="256" x2="210" y2="256" stroke="#999" stroke-width="1"/>
    <polygon points="210,256 205,251 205,261" fill="#999"/>

    <!-- Right: Online retrieval -->
    <rect x="420" y="65" width="460" height="260" rx="10" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
    <text x="650" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1565c0">在线检索 + 增强生成</text>

    <!-- User query -->
    <rect x="445" y="100" width="120" height="35" rx="6" fill="#2196F3" opacity="0.7"/>
    <text x="505" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="white">用户问题</text>

    <line x1="570" y1="117" x2="590" y2="117" stroke="#999" stroke-width="1"/>
    <polygon points="590,117 585,112 585,122" fill="#999"/>

    <!-- Query embedding -->
    <rect x="595" y="100" width="130" height="35" rx="6" fill="#4CAF50" opacity="0.7"/>
    <text x="660" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white">问题 Embedding</text>
    <text x="660" y="128" text-anchor="middle" font-family="monospace" font-size="8" fill="white">query → vector</text>

    <line x1="660" y1="140" x2="660" y2="160" stroke="#4CAF50" stroke-width="1.5"/>
    <polygon points="660,160 655,155 665,155" fill="#4CAF50"/>

    <!-- Vector search -->
    <rect x="595" y="165" width="130" height="40" rx="6" fill="#e8eaf6" stroke="#1a237e" stroke-width="1.5"/>
    <text x="660" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1a237e">向量检索 (ANN)</text>
    <text x="660" y="197" text-anchor="middle" font-family="monospace" font-size="8" fill="#1a237e">Top-K fragments</text>

    <line x1="660" y1="210" x2="660" y2="228" stroke="#999" stroke-width="1"/>
    <polygon points="660,228 655,223 665,223" fill="#999"/>

    <!-- Reranking (optional) -->
    <rect x="595" y="233" width="130" height="35" rx="6" fill="#fff3e0" stroke="#FF9800" stroke-width="1"/>
    <text x="660" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e65100">Reranking（可选）</text>
    <text x="660" y="263" text-anchor="middle" font-family="monospace" font-size="8" fill="#e65100">cross-encoder</text>

    <!-- Arrow to LLM -->
    <line x1="660" y1="271" x2="660" y2="290" stroke="#999" stroke-width="1"/>

    <!-- Prompt construction -->
    <rect x="445" y="155" width="120" height="55" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="1"/>
    <text x="505" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#c62828">Prompt 构造</text>
    <text x="505" y="188" text-anchor="middle" font-family="monospace" font-size="7" fill="#c62828">[检索片段]</text>
    <text x="505" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#c62828">+[用户问题]</text>

    <line x1="505" y1="213" x2="505" y2="285" stroke="#c62828" stroke-width="1.5"/>
    <polygon points="505,285 500,280 510,280" fill="#c62828"/>

    <!-- LLM -->
    <rect x="445" y="290" width="250" height="30" rx="6" fill="#2196F3"/>
    <text x="570" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">LLM 生成回答</text>

    <!-- Cost summary -->
    <rect x="30" y="350" width="850" height="65" rx="8" fill="#f5f5f5"/>
    <text x="455" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#333">成本对比</text>
    <text x="170" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#c62828">全量塞入：500 页 × 1K tok = 500K tok → $1.25/次</text>
    <text x="530" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">RAG 检索：5 片段 × 1K tok = 5K tok → $0.0125/次</text>
    <text x="790" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1565c0">成本降低 100 倍</text>

    <!-- Failure modes -->
    <rect x="30" y="430" width="850" height="55" rx="8" fill="#fff3e0"/>
    <text x="455" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e65100">三种典型失败模式</text>
    <text x="170" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">检索不到 → Query Rewriting</text>
    <text x="455" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">检索到不相关 → Reranking</text>
    <text x="740" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#555">LLM 忽略 → 位置优化</text>
  </g>
</svg>