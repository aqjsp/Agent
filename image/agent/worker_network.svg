<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="920" height="540" rx="16" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">超级大脑 vs 工人网络</text>
  <text x="460" y="60" text-anchor="middle" font-size="13" fill="#64748b">能力堆进一个什么都能调的 Agent，短期演示好看，长期在窗口、权限、故障、账单上一起爆</text>

  <rect x="28" y="84" width="420" height="420" rx="14" fill="#fff" stroke="#ef4444" stroke-width="2"/>
  <text x="238" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#b91c1c">超级大脑</text>
  <rect x="118" y="140" width="240" height="64" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="238" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">一个模型 · 所有工具</text>
  <text x="238" y="188" text-anchor="middle" font-size="11" fill="#991b1b">Router 都省了</text>
  <text x="238" y="232" text-anchor="middle" font-size="13" fill="#334155">窗口：检索和历史抢同一段</text>
  <text x="238" y="256" text-anchor="middle" font-size="13" fill="#334155">状态：全局变量式的大 State</text>
  <text x="238" y="280" text-anchor="middle" font-size="13" fill="#334155">权限：工具并集 = 攻击面并集</text>
  <text x="238" y="304" text-anchor="middle" font-size="13" fill="#334155">故障：一个工具慢，整个卡住</text>
  <text x="238" y="328" text-anchor="middle" font-size="13" fill="#334155">成本：旗舰模型处理所有路由</text>
  <text x="238" y="352" text-anchor="middle" font-size="13" fill="#334155">部署：一个有状态巨进程</text>
  <text x="238" y="392" text-anchor="middle" font-size="12" fill="#b45309">更强的模型配没有边界的工具表</text>
  <text x="238" y="414" text-anchor="middle" font-size="12" fill="#b45309">只是把第 8 篇的事故跑得更快</text>
  <text x="238" y="450" text-anchor="middle" font-size="12" fill="#64748b">少一个概念，多一堆不可逆的闸缺失</text>

  <rect x="472" y="84" width="420" height="420" rx="14" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="682" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#047857">工人网络</text>
  <rect x="500" y="140" width="110" height="52" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="555" y="162" text-anchor="middle" font-size="12" fill="#065f46">检索工人</text>
  <text x="555" y="180" text-anchor="middle" font-size="10" fill="#047857">只有搜索</text>
  <rect x="638" y="140" width="110" height="52" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="693" y="162" text-anchor="middle" font-size="12" fill="#065f46">写稿工人</text>
  <text x="693" y="180" text-anchor="middle" font-size="10" fill="#047857">不挂生产库</text>
  <rect x="776" y="140" width="90" height="52" rx="8" fill="#d1fae5" stroke="#059669"/>
  <text x="821" y="162" text-anchor="middle" font-size="12" fill="#065f46">变更工人</text>
  <text x="821" y="180" text-anchor="middle" font-size="10" fill="#047857">有票才写</text>
  <rect x="590" y="208" width="184" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="682" y="233" text-anchor="middle" font-size="12" fill="#1e3a8a">Supervisor / 交接协议</text>
  <text x="682" y="272" text-anchor="middle" font-size="13" fill="#334155">一件事 · 一个小工具箱</text>
  <text x="682" y="296" text-anchor="middle" font-size="13" fill="#334155">一张短票 · 一份自己的摘要</text>
  <text x="682" y="320" text-anchor="middle" font-size="13" fill="#334155">通信：指针 + 摘要，不共享大脑</text>
  <text x="682" y="344" text-anchor="middle" font-size="13" fill="#334155">跨团队才上任务协议</text>
  <text x="682" y="380" text-anchor="middle" font-size="12" fill="#047857">按工具边界和失败边界划</text>
  <text x="682" y="402" text-anchor="middle" font-size="12" fill="#047857">不要按部门名称划</text>
  <text x="682" y="438" text-anchor="middle" font-size="12" fill="#64748b">工人多了不会自动变智能</text>
  <text x="682" y="458" text-anchor="middle" font-size="12" fill="#64748b">还是要第 9 篇那一问：需不需要看见全局的人</text>
</svg>
