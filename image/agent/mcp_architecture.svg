<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620">
  <rect width="1000" height="620" rx="12" fill="#fafafa"/>
  <g transform="translate(70,60)">
    <text x="420" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">MCP 三层架构与通信机制</text>
    <text x="420" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">Host → Client → Server · 基于 JSON-RPC 2.0</text>

    <!-- Host -->
    <rect x="30" y="70" width="250" height="300" rx="10" fill="#e3f2fd" stroke="#2196F3" stroke-width="2"/>
    <text x="155" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#1565c0">Host（宿主）</text>
    <text x="155" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1565c0">Claude Desktop / Cursor</text>

    <rect x="55" y="125" width="200" height="30" rx="6" fill="#2196F3" opacity="0.7"/>
    <text x="155" y="145" text-anchor="middle" font-family="monospace" font-size="10" fill="white">LLM (推理引擎)</text>

    <rect x="55" y="165" width="200" height="30" rx="6" fill="#2196F3" opacity="0.5"/>
    <text x="155" y="185" text-anchor="middle" font-family="monospace" font-size="10" fill="white">Tool 调用决策</text>

    <rect x="55" y="205" width="200" height="30" rx="6" fill="#2196F3" opacity="0.3"/>
    <text x="155" y="225" text-anchor="middle" font-family="monospace" font-size="10" fill="#1565c0">用户界面</text>

    <!-- Client boxes -->
    <rect x="55" y="255" width="90" height="45" rx="6" fill="#bbdefb" stroke="#2196F3" stroke-width="1"/>
    <text x="100" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#1565c0">Client A</text>
    <text x="100" y="290" text-anchor="middle" font-family="monospace" font-size="7" fill="#1565c0">→ Server 1</text>

    <rect x="160" y="255" width="90" height="45" rx="6" fill="#bbdefb" stroke="#2196F3" stroke-width="1"/>
    <text x="205" y="275" text-anchor="middle" font-family="monospace" font-size="9" fill="#1565c0">Client B</text>
    <text x="205" y="290" text-anchor="middle" font-family="monospace" font-size="7" fill="#1565c0">→ Server 2</text>

    <rect x="55" y="310" width="90" height="45" rx="6" fill="#bbdefb" stroke="#2196F3" stroke-width="1"/>
    <text x="100" y="330" text-anchor="middle" font-family="monospace" font-size="9" fill="#1565c0">Client C</text>
    <text x="100" y="345" text-anchor="middle" font-family="monospace" font-size="7" fill="#1565c0">→ Server 3</text>

    <!-- Connection lines -->
    <line x1="280" y1="277" x2="340" y2="155" stroke="#4CAF50" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="280" y1="277" x2="340" y2="285" stroke="#FF9800" stroke-width="1.5" stroke-dasharray="4,2"/>
    <line x1="280" y1="332" x2="340" y2="410" stroke="#9C27B0" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- Server 1: GitHub -->
    <rect x="340" y="80" width="230" height="160" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="2"/>
    <text x="455" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">MCP Server</text>
    <text x="455" y="122" text-anchor="middle" font-family="monospace" font-size="10" fill="#2e7d32">GitHub Server</text>

    <rect x="365" y="135" width="180" height="25" rx="4" fill="#c8e6c9"/>
    <text x="455" y="152" text-anchor="middle" font-family="monospace" font-size="9" fill="#1b5e20">Tools: create_issue, search</text>

    <rect x="365" y="165" width="180" height="25" rx="4" fill="#c8e6c9"/>
    <text x="455" y="182" text-anchor="middle" font-family="monospace" font-size="9" fill="#1b5e20">Resources: repo_files, PR</text>

    <rect x="365" y="195" width="180" height="25" rx="4" fill="#c8e6c9"/>
    <text x="455" y="212" text-anchor="middle" font-family="monospace" font-size="9" fill="#1b5e20">Prompts: code_review</text>

    <!-- Server 2: Database -->
    <rect x="340" y="250" width="230" height="160" rx="10" fill="#fff3e0" stroke="#FF9800" stroke-width="2"/>
    <text x="455" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100">MCP Server</text>
    <text x="455" y="292" text-anchor="middle" font-family="monospace" font-size="10" fill="#e65100">Database Server</text>

    <rect x="365" y="305" width="180" height="25" rx="4" fill="#ffe0b2"/>
    <text x="455" y="322" text-anchor="middle" font-family="monospace" font-size="9" fill="#bf360c">Tools: execute_sql [destructive]</text>

    <rect x="365" y="335" width="180" height="25" rx="4" fill="#ffe0b2"/>
    <text x="455" y="352" text-anchor="middle" font-family="monospace" font-size="9" fill="#bf360c">Resources: schema, tables</text>

    <rect x="365" y="365" width="180" height="25" rx="4" fill="#ffe0b2"/>
    <text x="455" y="382" text-anchor="middle" font-family="monospace" font-size="9" fill="#bf360c">Prompts: query_builder</text>

    <!-- Server 3: Knowledge -->
    <rect x="340" y="420" width="230" height="90" rx="10" fill="#e8eaf6" stroke="#9C27B0" stroke-width="2"/>
    <text x="455" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#6a1b9a">MCP Server</text>
    <text x="455" y="462" text-anchor="middle" font-family="monospace" font-size="10" fill="#6a1b9a">RAG Knowledge Server</text>

    <rect x="365" y="472" width="180" height="25" rx="4" fill="#d1c4e9"/>
    <text x="455" y="489" text-anchor="middle" font-family="monospace" font-size="9" fill="#4a148c">Tools: search_docs [readOnly]</text>

    <!-- Right: Protocol details -->
    <rect x="620" y="80" width="270" height="430" rx="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="755" y="105" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#333">协议细节</text>

    <text x="645" y="135" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#1565c0">通信基础</text>
    <text x="645" y="155" font-family="monospace" font-size="10" fill="#555">JSON-RPC 2.0</text>
    <text x="645" y="170" font-family="monospace" font-size="10" fill="#555">Streamable HTTP</text>
    <text x="645" y="185" font-family="monospace" font-size="10" fill="#555">Mcp-Session-Id</text>

    <text x="645" y="215" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#2e7d32">三种原语</text>
    <text x="645" y="235" font-family="monospace" font-size="10" fill="#555">Tools (主动调用)</text>
    <text x="645" y="250" font-family="monospace" font-size="10" fill="#555">Resources (被动读取)</text>
    <text x="645" y="265" font-family="monospace" font-size="10" fill="#555">Prompts (模板)</text>

    <text x="645" y="295" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#e65100">安全机制</text>
    <text x="645" y="315" font-family="monospace" font-size="10" fill="#555">readOnly 标记</text>
    <text x="645" y="330" font-family="monospace" font-size="10" fill="#555">destructive 标记 → HITL</text>
    <text x="645" y="345" font-family="monospace" font-size="10" fill="#555">Sampling (反向推理)</text>

    <text x="645" y="375" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#6a1b9a">2026 新能力</text>
    <text x="645" y="395" font-family="monospace" font-size="10" fill="#555">MCP Tasks (异步)</text>
    <text x="645" y="410" font-family="monospace" font-size="10" fill="#555">MCP Bundle (.mcpb)</text>
    <text x="645" y="425" font-family="monospace" font-size="10" fill="#555">MCP Registry</text>
    <text x="645" y="440" font-family="monospace" font-size="10" fill="#555">MCP Apps (UI)</text>

    <text x="645" y="470" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#c62828">核心范式</text>
    <text x="645" y="490" font-family="Arial,sans-serif" font-size="11" fill="#c62828">"描述即接口"</text>
  </g>
</svg>