<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#475569"/></marker></defs>
<style>.h{font-size:20px;font-weight:700;fill:#0f172a}.t{font-size:14px;font-weight:600;fill:#0f172a}.s{font-size:12px;fill:#475569}.m{font-family:Menlo,Consolas,monospace;font-size:12px;fill:#1e293b;white-space:pre}.l{stroke:#475569;stroke-width:1.4;fill:none;marker-end:url(#a)}.c{text-anchor:middle}</style>
<rect width="960" height="470" fill="#fff"/>
<text x="30" y="36" class="h">跨越多个上下文窗口：状态放在文件系统和 git，不放在对话历史</text>

<rect x="30" y="60" width="200" height="190" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="130" y="86" class="t c">窗口 1</text>
<text x="130" y="106" class="t c">Initializer Agent</text>
<text x="46" y="134" class="s">· 展开需求为功能清单</text>
<text x="46" y="156" class="s">· 写 init.sh 启动服务</text>
<text x="46" y="178" class="s">· 建进度文件</text>
<text x="46" y="200" class="s">· 初始 git 提交</text>
<text x="46" y="230" class="s">只跑一次，专用提示词</text>

<g>
<rect x="290" y="60" width="200" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="390" y="86" class="t c">窗口 2</text><text x="390" y="106" class="t c">Coding Agent</text>
<rect x="510" y="60" width="200" height="190" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="610" y="86" class="t c">窗口 3</text><text x="610" y="106" class="t c">Coding Agent</text>
<text x="740" y="160" class="t">…… 窗口 N</text>
</g>
<g class="s"><text x="306" y="134">1 读进度文件 + git log</text><text x="306" y="156">2 跑冒烟测试，抓遗留 bug</text><text x="306" y="178">3 只挑一个功能做</text><text x="306" y="200">4 端到端验证后标 passing</text><text x="306" y="222">5 git commit + 写进度</text>
<text x="526" y="134">1 读进度文件 + git log</text><text x="526" y="156">2 跑冒烟测试，抓遗留 bug</text><text x="526" y="178">3 只挑一个功能做</text><text x="526" y="200">4 端到端验证后标 passing</text><text x="526" y="222">5 git commit + 写进度</text></g>
<path d="M230 155 L286 155" class="l"/><path d="M490 155 L506 155" class="l"/><path d="M710 155 L734 155" class="l"/>

<rect x="30" y="284" width="900" height="166" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="46" y="310" class="t">工作区（Runtime 必须在窗口之间、机器之间完整保留）</text>
<rect x="46" y="324" width="280" height="110" rx="8" fill="#fff" stroke="#d97706"/>
<text x="58" y="346" class="m">feature_list.json</text>
<text x="58" y="368" class="m">{"desc": "新建对话并收到回复",</text>
<text x="58" y="388" class="m"> "passes": false}</text>
<text x="58" y="420" class="s">claude.ai 克隆示例：200+ 条，初始全 failing</text>
<rect x="340" y="324" width="190" height="110" rx="8" fill="#fff" stroke="#d97706"/>
<text x="352" y="346" class="m">claude-progress.txt</text>
<text x="352" y="370" class="s">做过什么、卡在哪</text>
<text x="352" y="392" class="s">下一步建议</text>
<rect x="544" y="324" width="160" height="110" rx="8" fill="#fff" stroke="#d97706"/>
<text x="556" y="346" class="m">git log</text>
<text x="556" y="370" class="s">可回滚的工作历史</text>
<text x="556" y="392" class="s">每窗口至少一次提交</text>
<rect x="718" y="324" width="196" height="110" rx="8" fill="#fff" stroke="#d97706"/>
<text x="730" y="346" class="m">init.sh</text>
<text x="730" y="370" class="s">新窗口一条命令</text>
<text x="730" y="392" class="s">拉起开发环境</text>
<path d="M390 250 L390 280" class="l"/><path d="M610 250 L610 280" class="l"/><path d="M130 250 L130 280" class="l"/>
</svg>
