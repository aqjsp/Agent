<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580">
  <rect width="920" height="580" rx="12" fill="#fafafa"/>
  <g transform="translate(40,40)">
    <!-- Title -->
    <text x="420" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a">State 膨胀控制策略对比</text>
    <text x="420" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#888">没有银弹——每种策略都在 Token 成本、存储成本、信息完整性之间做取舍</text>

    <!-- Strategy 1: Summary -->
    <rect x="30" y="70" width="200" height="310" rx="10" fill="#e3f2fd" stroke="#2196F3" stroke-width="1.5"/>
    <text x="130" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1565c0">Summary 压缩</text>
    <text x="130" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#1565c0">llm.summarize()</text>

    <!-- Visual: long history → compressed -->
    <rect x="50" y="128" width="160" height="18" rx="3" fill="#bbdefb"/>
    <text x="130" y="141" text-anchor="middle" font-family="monospace" font-size="8" fill="#0d47a1">msg1 msg2 msg3 ... msg50</text>
    <line x1="130" y1="150" x2="130" y2="168" stroke="#2196F3" stroke-width="1.5"/>
    <polygon points="130,168 125,161 135,161" fill="#2196F3"/>
    <rect x="65" y="173" width="130" height="30" rx="4" fill="#90caf9"/>
    <text x="130" y="188" text-anchor="middle" font-family="monospace" font-size="8" fill="#0d47a1">summary + msg41~50</text>
    <text x="130" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#1565c0">50 条 → 10 条 + 摘要</text>

    <!-- Pros/Cons -->
    <text x="55" y="228" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">优点</text>
    <text x="55" y="245" font-family="Arial,sans-serif" font-size="10" fill="#555">Token 可控</text>
    <text x="55" y="260" font-family="Arial,sans-serif" font-size="10" fill="#555">保留语义</text>
    <text x="55" y="280" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">代价</text>
    <text x="55" y="297" font-family="Arial,sans-serif" font-size="10" fill="#555">压缩本身消耗 Token</text>
    <text x="55" y="312" font-family="Arial,sans-serif" font-size="10" fill="#555">摘要有信息损失</text>
    <text x="55" y="327" font-family="Arial,sans-serif" font-size="10" fill="#555">延迟增加</text>

    <rect x="55" y="345" width="150" height="22" rx="4" fill="#bbdefb"/>
    <text x="130" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1565c0">适合：对话型 Agent</text>

    <!-- Strategy 2: Sliding Window -->
    <rect x="250" y="70" width="200" height="310" rx="10" fill="#fff3e0" stroke="#FF9800" stroke-width="1.5"/>
    <text x="350" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#e65100">滑动窗口</text>
    <text x="350" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#e65100">keep_last_n(50)</text>

    <!-- Visual: window -->
    <rect x="270" y="128" width="160" height="18" rx="3" fill="#ffe0b2"/>
    <text x="350" y="141" text-anchor="middle" font-family="monospace" font-size="8" fill="#e65100">msg1 msg2 ... msg100</text>
    <line x1="350" y1="150" x2="350" y2="168" stroke="#FF9800" stroke-width="1.5"/>
    <polygon points="350,168 345,161 355,161" fill="#FF9800"/>
    <rect x="295" y="173" width="110" height="30" rx="4" fill="#ffcc80"/>
    <text x="350" y="188" text-anchor="middle" font-family="monospace" font-size="8" fill="#e65100">msg51~100</text>
    <text x="350" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#bf360c">硬上限：丢弃前 50 条</text>

    <text x="275" y="228" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">优点</text>
    <text x="275" y="245" font-family="Arial,sans-serif" font-size="10" fill="#555">简单粗暴</text>
    <text x="275" y="260" font-family="Arial,sans-serif" font-size="10" fill="#555">State 大小有硬上限</text>
    <text x="275" y="280" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">代价</text>
    <text x="275" y="297" font-family="Arial,sans-serif" font-size="10" fill="#555">丢弃的消息永久丢失</text>
    <text x="275" y="312" font-family="Arial,sans-serif" font-size="10" fill="#555">无法回溯</text>
    <text x="275" y="327" font-family="Arial,sans-serif" font-size="10" fill="#555">可能丢失关键上下文</text>

    <rect x="275" y="345" width="150" height="22" rx="4" fill="#ffe0b2"/>
    <text x="350" y="361" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#e65100">适合：短对话 / 日志</text>

    <!-- Strategy 3: Tiered Storage -->
    <rect x="470" y="70" width="200" height="310" rx="10" fill="#e8f5e9" stroke="#4CAF50" stroke-width="1.5"/>
    <text x="570" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#2e7d32">分层存储</text>
    <text x="570" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#2e7d32">Hot + VectorDB</text>

    <!-- Visual: tiered -->
    <rect x="495" y="128" width="150" height="18" rx="3" fill="#c8e6c9"/>
    <text x="570" y="141" text-anchor="middle" font-family="monospace" font-size="8" fill="#1b5e20">Hot: 最近 10 条消息</text>
    <rect x="495" y="150" width="150" height="18" rx="3" fill="#e0e0e0"/>
    <text x="570" y="163" text-anchor="middle" font-family="monospace" font-size="8" fill="#666">Cold: 向量数据库</text>
    <line x1="570" y1="172" x2="570" y2="188" stroke="#4CAF50" stroke-width="1.5"/>
    <polygon points="570,188 565,181 575,181" fill="#4CAF50"/>
    <rect x="505" y="193" width="130" height="30" rx="4" fill="#a5d6a7"/>
    <text x="570" y="208" text-anchor="middle" font-family="monospace" font-size="8" fill="#1b5e20">按需检索注入 State</text>
    <text x="570" y="220" text-anchor="middle" font-family="monospace" font-size="7" fill="#2e7d32">State 只放"当前需要"</text>

    <text x="495" y="248" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">优点</text>
    <text x="495" y="265" font-family="Arial,sans-serif" font-size="10" fill="#555">State 大小稳定</text>
    <text x="495" y="280" font-family="Arial,sans-serif" font-size="10" fill="#555">长程记忆无限扩展</text>
    <text x="495" y="300" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">代价</text>
    <text x="495" y="317" font-family="Arial,sans-serif" font-size="10" fill="#555">引入外部存储依赖</text>
    <text x="495" y="332" font-family="Arial,sans-serif" font-size="10" fill="#555">检索质量影响表现</text>
    <text x="495" y="347" font-family="Arial,sans-serif" font-size="10" fill="#555">架构复杂度高</text>

    <rect x="495" y="360" width="150" height="22" rx="4" fill="#c8e6c9"/>
    <text x="570" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2e7d32">适合：知识密集型 Agent</text>

    <!-- Strategy 4: Delta Channel -->
    <rect x="690" y="70" width="180" height="310" rx="10" fill="#e8eaf6" stroke="#1a237e" stroke-width="1.5"/>
    <text x="780" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#1a237e">Delta Channel</text>
    <text x="780" y="113" text-anchor="middle" font-family="monospace" font-size="9" fill="#1a237e">v1.2+ 增量存储</text>

    <!-- Visual: delta -->
    <rect x="710" y="128" width="140" height="18" rx="3" fill="#c5cae9"/>
    <text x="780" y="141" text-anchor="middle" font-family="monospace" font-size="8" fill="#1a237e">CP1: 完整 1MB</text>
    <rect x="710" y="150" width="140" height="18" rx="3" fill="#e8eaf6"/>
    <text x="780" y="163" text-anchor="middle" font-family="monospace" font-size="8" fill="#1a237e">CP2: delta 5KB</text>
    <rect x="710" y="172" width="140" height="18" rx="3" fill="#e8eaf6"/>
    <text x="780" y="185" text-anchor="middle" font-family="monospace" font-size="8" fill="#1a237e">CP3: delta 3KB</text>
    <line x1="780" y1="194" x2="780" y2="210" stroke="#1a237e" stroke-width="1.5"/>
    <polygon points="780,210 775,203 785,203" fill="#1a237e"/>
    <rect x="720" y="215" width="120" height="30" rx="4" fill="#9fa8da"/>
    <text x="780" y="230" text-anchor="middle" font-family="monospace" font-size="8" fill="#1a237e">1MB + 5KB + 3KB</text>
    <text x="780" y="242" text-anchor="middle" font-family="monospace" font-size="7" fill="#283593">vs 传统 3 × 1MB</text>

    <text x="710" y="270" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">优点</text>
    <text x="710" y="287" font-family="Arial,sans-serif" font-size="10" fill="#555">存储大幅减少</text>
    <text x="710" y="305" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#c62828">代价</text>
    <text x="710" y="322" font-family="Arial,sans-serif" font-size="10" fill="#555">读取需回放增量链</text>
    <text x="710" y="337" font-family="Arial,sans-serif" font-size="10" fill="#555">Time Travel 变慢</text>
    <text x="710" y="352" font-family="Arial,sans-serif" font-size="10" fill="#555">需 v1.2+</text>

    <rect x="710" y="365" width="140" height="22" rx="4" fill="#c5cae9"/>
    <text x="780" y="381" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#1a237e">适合：长对话 Agent</text>

    <!-- Bottom: Combination guide -->
    <rect x="30" y="410" width="840" height="70" rx="8" fill="#f5f5f5"/>
    <text x="420" y="432" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#333">生产环境推荐组合</text>
    <text x="170" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#1565c0">对话型：Summary + 滑动窗口</text>
    <text x="420" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#2e7d32">知识密集型：分层存储 + Delta Channel</text>
    <text x="680" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e65100">长程记忆型：Summary + 分层存储</text>
    <text x="420" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="#c62828">原则：State 里只放"当前步骤需要"的数据，其余压缩/外置/丢弃</text>
  </g>
</svg>